<style>
:root{
  --azul:#1450B4; --azul-2:#0F3F8F; --marino:#0A2A63; --rojo:#D62839; --oro:#F2B705;
  --bg:#EEF3FA; --card:#FFFFFF; --ink:#0E1B33; --muted:#5B6B86; --line:#D6DFEC; --soft:#E3EBF7;
  --ok:#168A4A; --ko:#C2283A; --draw:#8A7A1A;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --azul:#3D7BE0; --azul-2:#2C62BD; --marino:#0A1A3A;
    --bg:#08111F; --card:#111F38; --ink:#E8EEF8; --muted:#97A6C2; --line:#22355A; --soft:#172A4B;
    --ok:#3FBF77; --ko:#F0596A; --draw:#D6C35A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --azul:#3D7BE0; --azul-2:#2C62BD; --marino:#0A1A3A;
  --bg:#08111F; --card:#111F38; --ink:#E8EEF8; --muted:#97A6C2; --line:#22355A; --soft:#172A4B;
  --ok:#3FBF77; --ko:#F0596A; --draw:#D6C35A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--azul)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
img{max-width:100%}
.stripes{background:repeating-linear-gradient(90deg,var(--azul) 0 26px,#fff 26px 40px)}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;line-height:1}

/* Login */
.login{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.login-band{height:34vh;min-height:200px;position:relative;display:flex;align-items:flex-end;padding:20px clamp(14px,4vw,24px)}
.crest{background:var(--marino);color:#fff;padding:16px 20px 18px;border-radius:4px 4px 18px 18px;box-shadow:0 10px 30px rgba(10,42,99,.35);max-width:min(26rem,100%);min-width:0;display:flex;align-items:center;gap:clamp(10px,3vw,16px)}
.escudo{flex:none;border-radius:50%;display:block;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 6px 18px rgba(0,0,0,.35)}
.crest .escudo{width:clamp(60px,18vw,88px);height:clamp(60px,18vw,88px)}
.top-inner .escudo{width:38px;height:38px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.crest h1{font-size:clamp(1.8rem,8.5vw,2.6rem);font-weight:900;text-transform:uppercase}
.crest p{margin:.35rem 0 0;color:#C9D7F2;font-size:.85rem}
.login-body{padding:24px clamp(14px,4vw,24px) 40px;max-width:30rem;width:100%}
.login-body .input{min-width:0}
.login-body label{display:block;font-weight:600;margin-bottom:8px}
.hint{color:var(--muted);font-size:.9rem;margin-top:14px}
.hint code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.88rem}
.err{color:var(--ko);font-weight:600;margin-top:10px;min-height:1.4em}

/* Inputs & buttons */
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:1rem}
.input:focus{border-color:var(--azul);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--azul);color:#fff;text-decoration:none;font-size:.95rem}
.btn.block{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.red{background:var(--rojo)}
.btn.small{padding:7px 11px;font-size:.84rem;border-radius:10px}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .stripes{height:10px}
.top-inner{background:var(--marino);color:#fff;padding:10px max(14px,calc((100% - 64rem) / 2));display:flex;align-items:center;gap:12px}
.top-inner > div{min-width:0}
.top-inner h1{font-size:1.4rem;font-weight:900;text-transform:uppercase}
.top-inner small{display:block;color:#C9D7F2;font-size:.76rem;margin-top:2px;font-family:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-admin{margin-left:auto;background:var(--oro);color:#2a2100;font-weight:700;font-size:.75rem;padding:4px 8px;border-radius:999px}

main{max-width:44rem;margin:0 auto;padding:16px 14px 100px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.section-h h2{font-size:1.3rem;font-weight:800}
.muted{color:var(--muted)}

/* Next match hero */
.hero{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.hero-top{position:relative;padding:14px 16px 16px;color:#fff;background:var(--azul)}
.hero-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.13) 34px 50px);pointer-events:none}
.hero-top > *{position:relative;z-index:1}
.hero-label{font-weight:600;font-size:.8rem;opacity:.9}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin:10px 0 4px}
.vs .t{font-family:var(--display);font-weight:900;font-size:clamp(1.05rem,4.4vw,1.4rem);line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.vs .t.r{text-align:right}
.vs .x{font-family:var(--display);font-weight:800;font-size:.9rem;opacity:.8}
.when{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,5.6vw,1.75rem);line-height:1.05;margin-top:10px}
.cap1::first-letter{text-transform:uppercase}
.hero-body{padding:14px 16px 16px;display:grid;gap:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fact b{display:block;font-size:1rem;overflow-wrap:anywhere}
.fact span{color:var(--muted);font-size:.78rem}
.kit{display:flex;align-items:center;gap:10px}
.kit svg{flex:none}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.date-chip{flex:none;width:44px;text-align:center;border-radius:10px;background:var(--soft);padding:5px 0}
.date-chip b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1}
.date-chip span{font-size:.68rem;color:var(--muted);text-transform:capitalize}
.item .main{flex:1;min-width:0}
.item .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.93rem}
.item .main span{font-size:.78rem;color:var(--muted)}
.score{flex:none;font-family:var(--display);font-weight:900;font-size:1.3rem;padding:2px 8px;border-radius:9px;min-width:52px;text-align:center}
.score.w{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.score.l{background:color-mix(in srgb,var(--ko) 16%,transparent);color:var(--ko)}
.score.d{background:color-mix(in srgb,var(--draw) 18%,transparent);color:var(--draw)}

.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Table */
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px clamp(3px,1.2vw,8px);text-align:center;font-size:.86rem}
th{color:var(--muted);font-weight:600;font-size:.72rem;border-bottom:1px solid var(--line)}
td.eq,th.eq{text-align:left}
td.eq{line-height:1.25}
td.pos{font-family:var(--display);font-weight:800;font-size:1.05rem;width:28px}
td.pts{font-family:var(--display);font-weight:900;font-size:1.1rem}
tr.us td{background:color-mix(in srgb,var(--azul) 12%,transparent)}
tr.us td.eq{font-weight:700}
tbody tr+tr td{border-top:1px solid var(--line)}

/* Scorers */
.scorer{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.scorer:first-child{border-top:0}
.scorer .rank{font-family:var(--display);font-weight:800;font-size:1.3rem;width:24px;color:var(--muted)}
.scorer .goals{margin-left:auto;font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;color:var(--azul)}
.scorer.top1{background:linear-gradient(90deg,color-mix(in srgb,var(--oro) 22%,transparent),transparent)}
.scorer.top1 .rank{color:var(--ink)}

/* Avatars */
.av{flex:none;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;font-family:var(--display);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Players grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;text-align:center;position:relative}
.pcard.me{border:2px solid var(--azul)}
.pcard .num{position:absolute;top:8px;left:11px;font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--azul)}
.pcard .av{margin:0 auto 10px}
.pcard b{display:block;font-size:.93rem;overflow-wrap:anywhere}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:.8rem;color:var(--muted)}
.stats strong{color:var(--ink)}
.pcard .actions{margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* Stars */
.stars{color:var(--oro);letter-spacing:1px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:grid;gap:2px;justify-items:center}
.rate button .stars{font-size:1.05rem}
.rate button span{font-size:.85rem;font-weight:600}
.rate button.on{border-color:var(--oro);background:color-mix(in srgb,var(--oro) 16%,var(--card))}

/* MVP */
.vote-list{display:grid;gap:8px}
.vote{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;width:100%}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--azul);border-radius:99px}
.mvp-win{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--oro) 18%,var(--card))}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:44rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);min-width:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--azul)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(5,15,35,.55)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px clamp(12px,4vw,18px) calc(28px + env(safe-area-inset-bottom,0px));max-width:44rem;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:1.5rem;font-weight:900;min-width:0;overflow-wrap:anywhere}
.x-btn{flex:none;border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:1.3rem;line-height:1}
.block:not(.btn){background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3.5vw,16px);margin-bottom:12px}
.block:not(.btn) h3{font-size:1.1rem;font-weight:800;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid .full{grid-column:1/-1}
.f label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.goal-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.goal-row input{width:72px;text-align:center}
.liga-edit input{padding:8px 3px;border-radius:8px;text-align:center;min-width:0}
.liga-edit .eqn{text-align:left}
.liga-edit input[type=number]{-moz-appearance:textfield;appearance:textfield}
.liga-edit input::-webkit-inner-spin-button,.liga-edit input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.liga-row{display:grid;grid-template-columns:minmax(78px,1fr) repeat(5,minmax(26px,44px)) 28px;gap:4px;align-items:center;margin-bottom:6px}
.liga-head{font-size:.75rem;color:var(--muted);font-weight:600;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.demo-note{font-size:.8rem;background:color-mix(in srgb,var(--oro) 20%,var(--card));border-radius:12px;padding:10px 12px;margin-bottom:14px}
/* Pantallas pequeñas */
@media (max-width:360px){
  .form-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .tab{font-size:.62rem}
}
/* Ordenador y tableta grande: dos columnas y barra de pestañas flotante */
@media (min-width:960px){
  main{max-width:64rem;padding:24px 24px 120px}
  .cols{display:grid;grid-template-columns:minmax(0,24rem) minmax(0,1fr);gap:28px;align-items:start}
  .col-a{position:sticky;top:84px}
  .cols:has(> .col-a:empty){grid-template-columns:minmax(0,1fr)}
  .col-b > .section-h:first-child{margin-top:4px}
  .tabbar{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:min(30rem,calc(100% - 32px));border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(10,30,70,.18);padding-bottom:0}
  .tab{font-size:.74rem;padding:9px 2px 10px}
  .sheet-panel{bottom:auto;top:50%;transform:translateY(-50%);max-height:86vh;border-radius:20px;padding-bottom:24px;animation:none}
  .grab{display:none}
  .toast{bottom:96px}
}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLLS = ["jugadores", "partidos", "valoraciones", "mvp", "liga"];
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- Almacenamiento ---------- */
function semilla(teamId){
  const sab = new Date(); sab.setDate(sab.getDate() + ((6 - sab.getDay() + 7) % 7 || 7));
  sab.setMinutes(sab.getMinutes() - sab.getTimezoneOffset());
  const nombre = teamId === "alevin" ? "Markel" : "Martin";
  const j1 = "j" + uid();
  return {
    jugadores: { [j1]: { nombre, dorsal: "" } },
    partidos: { ["p" + uid()]: {
      jornada: "1", fecha: sab.toISOString().slice(0,10), hora: "10:30", citacion: "10:00",
      rival: "Rival de ejemplo", local: true, campo: "Campo municipal de Espartinas",
      direccion: "Espartinas, Sevilla", equipacion: "azul", notas: "Partido de ejemplo: el delegado puede editarlo o borrarlo."
    }},
    valoraciones: {}, mvp: {},
    liga: { tabla: { filas: [{ equipo: CONFIG.club, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 }] } }
  };
}
class LocalStore {
  constructor(team){ this.key = "ecf-datos-" + team; this.cbs = {}; this.data = LS.get(this.key, null); if(!this.data){ this.data = semilla(team); this.save(); } }
  save(){ if(!LS.set(this.key, this.data)) toast("No hay espacio para guardar en este móvil"); }
  list(c){ return Object.entries(this.data[c] || {}).map(([id, v]) => ({ id, ...v })); }
  emit(c){ (this.cbs[c] || []).forEach(cb => cb(this.list(c))); }
  watch(c, cb){ (this.cbs[c] = this.cbs[c] || []).push(cb); cb(this.list(c)); }
  async set(c, id, v){ const { id: _, ...body } = v; (this.data[c] = this.data[c] || {})[id] = body; this.save(); this.emit(c); }
  async del(c, id){ if(this.data[c]) delete this.data[c][id]; this.save(); this.emit(c); }
  stop(){ this.cbs = {}; }
}
class FireStore {
  constructor(team){ this.base = "equipos/" + team; this.unsubs = []; this.db = firebase.firestore(); }
  watch(c, cb){
    this.unsubs.push(this.db.collection(this.base + "/" + c).onSnapshot(
      s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))),
      () => toast("No se pudo conectar con la base de datos")
    ));
  }
  set(c, id, v){ const { id: _, ...body } = v; return this.db.collection(this.base + "/" + c).doc(id).set(body); }
  del(c, id){ return this.db.collection(this.base + "/" + c).doc(id).delete(); }
  stop(){ this.unsubs.forEach(u => u()); this.unsubs = []; }
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function initFirebase(){
  if(!CONFIG.firebase) return false;
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js");
    firebase.initializeApp(CONFIG.firebase);
    return true;
  }catch(e){ return false; }
}

/* ---------- Utilidades de datos ---------- */
const jug = id => S.jugadores.find(j => j.id === id);
const jugadoresOrden = () => [...S.jugadores].sort((a, b) => (Number(a.dorsal) || 99) - (Number(b.dorsal) || 99) || a.nombre.localeCompare(b.nombre));
const jugado = p => p.gf !== undefined && p.gf !== null && p.gf !== "";
const fechaDe = p => new Date((p.fecha || "2100-01-01") + "T" + (p.hora || "12:00"));
const proximos = () => S.partidos.filter(p => !jugado(p) && (p.fecha || "") >= hoyISO()).sort((a, b) => fechaDe(a) - fechaDe(b));
const jugados = () => S.partidos.filter(p => jugado(p)).sort((a, b) => fechaDe(b) - fechaDe(a));
const pendientes = () => S.partidos.filter(p => !jugado(p) && (p.fecha || "") < hoyISO()).sort((a, b) => fechaDe(b) - fechaDe(a));
const golesDe = jid => S.partidos.reduce((n, p) => n + (Number(p.goles?.[jid]) || 0), 0);
function votosPartido(pid){ const t = {}; S.mvp.filter(v => v.partido === pid).forEach(v => { t[v.votado] = (t[v.votado] || 0) + 1; }); return t; }
function ganadoresMvp(pid){ const t = votosPartido(pid); const max = Math.max(0, ...Object.values(t)); return max ? Object.keys(t).filter(k => t[k] === max) : []; }
const mvpsDe = jid => jugados().filter(p => ganadoresMvp(p.id).includes(jid)).length;
function mediaDe(jid){ const v = S.valoraciones.filter(x => x.jugador === jid); return v.length ? v.reduce((a, b) => a + b.estrellas, 0) / v.length : null; }
const fmtMedia = m => m == null ? "–" : m.toFixed(1).replace(".", ",");
const fechaLarga = p => fechaDe(p).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
const mapsUrl = p => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(p.direccion || p.campo || "");
const equipos = p => p.local ? [CONFIG.club, p.rival] : [p.rival, CONFIG.club];
function resultado(p){ if(!jugado(p)) return ""; const gf = +p.gf, gc = +p.gc; return gf > gc ? "w" : gf < gc ? "l" : "d"; }
const marcador = p => p.local ? `${p.gf}-${p.gc}` : `${p.gc}-${p.gf}`;

/* ---------- Entrar a un equipo ---------- */
function entrar(){
  const eq = CONFIG.equipos.find(e => e.id === S.session?.teamId);
  if(!eq){ S.session = null; LS.del("ecf-sesion"); return renderLogin(); }
  S.team = eq;
  S.store?.stop();
  S.store = S.online ? new FireStore(eq.id) : new LocalStore(eq.id);
  let primera = true;
  COLLS.forEach(c => S.store.watch(c, rows => {
    S[c] = rows;
    render();
    if(S.sheet?.live) refrescarSheet();
    if(primera && c === "jugadores"){ primera = false; if(!S.session.me && rows.length) setTimeout(abrirQuienSoy, 300); }
  }));
}

function filasLiga(){
  const t = S.liga.find(x => x.id === "tabla");
  return (t?.filas || []).map(f => {
    const pg = +f.pg || 0, pe = +f.pe || 0, pp = +f.pp || 0, gf = +f.gf || 0, gc = +f.gc || 0;
    const pj = Number.isFinite(+f.pj) && f.pj !== "" && f.pj != null ? +f.pj : pg + pe + pp;
    const pts = Number.isFinite(+f.pts) && f.pts !== "" && f.pts != null ? +f.pts : pg * 3 + pe;
    const dg = f.dif != null && f.dif !== "" ? +f.dif : gf - gc; // la Liga Educa solo da la diferencia
    return { ...f, pg, pe, pp, gf, gc, pj, pts, dg };
  }).sort((a, b) => (+a.pos || 0) - (+b.pos || 0) || b.pts - a.pts || b.dg - a.dg || b.gf - a.gf); // orden oficial si viene «pos»
}

  } else {

      : `<p class="muted" style="margin:0">${+p.gf ? "Sin goleadores apuntados." : "No marcamos en este partido."}</p>`}</div>`;

    // Autovaloración
    if(me){
      const mia = S.valoraciones.find(v => v.partido === p.id && v.jugador === me)?.estrellas;
      html += `<div class="block"><h3>¿Cómo has jugado?</h3><div class="rate">
        ${[[3,"Bien"],[4,"Muy bien"],[5,"¡Crack!"]].map(([n, l]) => `<button class="${mia === n ? "on" : ""}" data-act="valorar" data-id="${p.id}" data-n="${n}" aria-pressed="${mia === n}">${estrellas(n)}<span>${l}</span></button>`).join("")}
      </div></div>`;
    }
    const vals = S.valoraciones.filter(v => v.partido === p.id).sort((x, y) => y.estrellas - x.estrellas);
    if(vals.length){
      html += `<div class="block"><h3>Así se ven ellos</h3>${vals.map(v => `<div class="row" style="padding:5px 0">${avatar(jug(v.jugador), 34)}<span class="grow">${esc(jug(v.jugador)?.nombre || "Jugador")}</span>${estrellas(v.estrellas)}</div>`).join("")}</div>`;
    }

    // MVP
    const tally = votosPartido(p.id), total = Object.values(tally).reduce((x, y) => x + y, 0);
    const miVoto = me && S.mvp.find(v => v.partido === p.id && v.votante === me);
    html += `<div class="block"><h3>MVP del partido</h3>`;
    if(me && !miVoto){
      const candidatos = jugadoresOrden().filter(j => j.id !== me);
      html += `<p class="muted" style="margin-top:0">Vota al mejor del partido. No vale votarse a uno mismo.</p><div class="vote-list">${candidatos.map(j =>
        `<button class="vote" data-act="votar" data-id="${p.id}" data-j="${j.id}">${avatar(j, 34)}<b class="grow">${esc(j.nombre)}</b><span class="muted">Votar</span></button>`).join("")}</div>`;
    } else if(!me){
      html += `<p class="muted" style="margin-top:0">Elige quién eres en la pestaña Yo para poder votar.</p>`;
    }
    if(total && (miVoto || !me || S.session.admin)){
      const gan = ganadoresMvp(p.id);
      html += gan.map(id => `<div class="mvp-win" style="margin-bottom:10px">${avatar(jug(id), 48)}<div><b>${esc(jug(id)?.nombre || "Jugador")}</b><div class="muted" style="font-size:.85rem">${gan.length > 1 ? "Empatado en cabeza" : "Va ganando el MVP"}</div></div></div>`).join("");
      html += Object.entries(tally).sort((x, y) => y[1] - x[1]).map(([id, n]) =>
        `<div style="padding:6px 0"><div class="row"><span class="grow">${esc(jug(id)?.nombre || "Jugador")}</span><b>${n} ${n === 1 ? "voto" : "votos"}</b></div><div class="bar"><i style="width:${Math.round(n / total * 100)}%"></i></div></div>`).join("");
      if(miVoto) html += `<p class="muted" style="font-size:.85rem;margin-bottom:0">Tu voto: ${esc(jug(miVoto.votado)?.nombre || "")}. <button class="btn small line" data-act="quitar-voto" data-id="${p.id}">Cambiar voto</button></p>`;
    } else if(miVoto){
      html += `<p class="muted">Gracias por votar.</p>`;
    } else if(!total && !me){
      html += `<p class="muted" style="margin:0">Aún no hay votos.</p>`;
    }
    html += `</div>`;
  }
  if(S.session.admin){
    html += `<div class="row"><button class="btn grow" data-act="editar-partido" data-id="${p.id}">${jugado(p) ? "Editar partido" : "Editar o poner resultado"}</button><button class="btn red" data-act="borrar-partido" data-id="${p.id}">Borrar</button></div>`;
  }
  return html;
}

function formPartido(p){
  const nuevo = !p; p = p || { local: true, equipacion: "azul" };
  const f = (n, l, v, t = "text", cls = "") => `<div class="f ${cls}"><label for="f-${n}">${l}</label><input class="input" id="f-${n}" name="${n}" type="${t}" value="${esc(v ?? "")}"></div>`;
  abrirSheet(`${cabecera(nuevo ? "Nuevo partido" : "Editar partido")}
  <form data-form="partido" data-id="${p.id || ""}">
    <div class="block"><div class="form-grid">
      ${f("rival", "Rival", p.rival, "text", "full")}
      ${f("fecha", "Fecha", p.fecha, "date")}
      ${f("jornada", "Jornada", p.jornada, "number")}
      ${f("hora", "Hora del partido", p.hora, "time")}
      ${f("citacion", "Hora de llegada", p.citacion, "time")}
      <div class="f"><label for="f-local">Dónde</label><select class="input" id="f-local" name="local"><option value="1" ${p.local ? "selected" : ""}>En casa</option><option value="0" ${!p.local ? "selected" : ""}>Fuera</option></select></div>
      <div class="f"><label for="f-eq">Equipación</label><select class="input" id="f-eq" name="equipacion"><option value="azul" ${p.equipacion !== "roja" ? "selected" : ""}>Azul a rayas</option><option value="roja" ${p.equipacion === "roja" ? "selected" : ""}>Roja</option></select></div>
      ${f("campo", "Nombre del campo", p.campo, "text", "full")}
      ${f("direccion", "Dirección para Google Maps", p.direccion, "text", "full")}
      <div class="f full"><label for="f-notas">Notas</label><textarea class="input" id="f-notas" name="notas" rows="2">${esc(p.notas || "")}</textarea></div>
    </div></div>
    <div class="block"><h3>Resultado</h3><p class="muted" style="margin-top:0;font-size:.9rem">Déjalo vacío si aún no se ha jugado.</p>
      <div class="form-grid">${f("gf", "Goles Espartinas", p.gf, "number")}${f("gc", "Goles rival", p.gc, "number")}</div></div>
    <div class="block"><h3>Goleadores</h3>${S.jugadores.length ? jugadoresOrden().map(j =>
      `<div class="goal-row">${avatar(j, 32)}<label class="grow" for="g-${j.id}">${esc(j.nombre)}</label><input class="input" id="g-${j.id}" type="number" min="0" name="g_${j.id}" value="${esc(p.goles?.[j.id] || "")}" placeholder="0"></div>`).join("")
      : `<p class="muted" style="margin:0">Añade jugadores en la pestaña Equipo para apuntar goleadores.</p>`}</div>
    <button class="btn block" type="submit">Guardar partido</button>
  </form>`);
}

function formLiga(){
  const t = S.liga.find(x => x.id === "tabla");
  const filas = (t?.filas?.length ? t.filas : [{ equipo: CONFIG.club }]);
  const fila = (r = {}) => `<div class="liga-row liga-edit">
    <input class="input eqn" name="equipo" value="${esc(r.equipo || "")}" placeholder="Equipo" aria-label="Equipo">
    ${["pg","pe","pp","gf","gc"].map(k => `<input class="input" type="number" min="0" name="${k}" value="${esc(r[k] ?? "")}" aria-label="${k}">`).join("")}
    <button type="button" class="x-btn" style="width:32px;height:32px" data-act="quitar-fila" aria-label="Quitar">×</button></div>`;
  abrirSheet(`${cabecera("Clasificación")}
  <form data-form="liga">
    <div class="block">
      <p class="muted" style="margin-top:0;font-size:.9rem">Copia los datos de la web de la liga. Partidos jugados y puntos se calculan solos.</p>
      <div class="liga-row liga-head"><span style="text-align:left">Equipo</span><span>G</span><span>E</span><span>P</span><span>GF</span><span>GC</span><span></span></div>
      <div id="filas">${filas.map(fila).join("")}</div>
      <button type="button" class="btn small ghost" data-act="add-fila">Añadir equipo</button>
    </div>
    <button class="btn block" type="submit">Guardar clasificación</button>
  </form>`);
  ACT._fila = fila;
}

function formJugador(j){
  const nuevo = !j; j = j || {};
  abrirSheet(`${cabecera(nuevo ? "Nuevo jugador" : "Editar jugador")}
  <form data-form="jugador" data-id="${j.id || ""}">
    <div class="block"><div class="form-grid">
      <div class="f full"><label for="j-n">Nombre</label><input class="input" id="j-n" name="nombre" required value="${esc(j.nombre || "")}"></div>
      <div class="f"><label for="j-d">Dorsal</label><input class="input" id="j-d" name="dorsal" type="number" min="0" value="${esc(j.dorsal || "")}"></div>
    </div></div>
    <div class="row"><button class="btn grow" type="submit">Guardar</button>${nuevo ? "" : `<button type="button" class="btn red" data-act="borrar-jugador" data-id="${j.id}">Borrar</button>`}</div>
  </form>`);
}

function abrirQuienSoy(){
  if(!S.jugadores.length) return;
  abrirSheet(`${cabecera("¿Quién eres?")}
    <p class="muted" style="margin-top:0">Elige tu nombre. Así podrás valorarte, votar al MVP y poner tu foto.</p>
    <div class="vote-list">${jugadoresOrden().map(j => `<button class="vote" data-act="soy" data-id="${j.id}">${avatar(j, 40)}<b class="grow">${esc(j.nombre)}</b>${j.dorsal ? `<span class="muted">${esc(j.dorsal)}</span>` : ""}</button>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">¿No sales? Pide al delegado que te añada.</p>`);
}

/* ---------- Fotos ---------- */
function reducirImagen(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 320, c = document.createElement("canvas"); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8));
    };
    img.onerror = rej; img.src = url;
  });
}
let fotoPara = null;
$("#foto-input").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if(!file || !fotoPara) return;
  try{
    const foto = await reducirImagen(file);
    const j = jug(fotoPara);
    await S.store.set("jugadores", j.id, { ...j, foto });
    toast("Foto guardada");
  }catch(err){ toast("No se pudo usar esa imagen"); }
});

/* ---------- Acciones ---------- */
const ACT = {
  close: cerrarSheet,
  tab: t => { S.tab = t.dataset.tab; window.scrollTo(0, 0); render(); },
  partido: t => { const p = S.partidos.find(x => x.id === t.dataset.id); if(p) abrirSheet(htmlPartido(p), { tipo: "partido", id: p.id, live: true }); },
  "nuevo-partido": () => formPartido(null),
  "editar-partido": t => formPartido(S.partidos.find(x => x.id === t.dataset.id)),
  "borrar-partido": async t => { if(!confirm("¿Borrar este partido?")) return; await S.store.del("partidos", t.dataset.id); cerrarSheet(); toast("Partido borrado"); },
  valorar: async t => {
    const me = S.session.me; if(!me) return;
    await S.store.set("valoraciones", t.dataset.id + "_" + me, { partido: t.dataset.id, jugador: me, estrellas: +t.dataset.n });
    toast("Valoración guardada");
  },
  votar: async t => {
    const me = S.session.me; if(!me || t.dataset.j === me) return;
    await S.store.set("mvp", t.dataset.id + "_" + me, { partido: t.dataset.id, votante: me, votado: t.dataset.j });
    toast("Voto guardado");
  },
  "quitar-voto": async t => { await S.store.del("mvp", t.dataset.id + "_" + S.session.me); },
  "editar-liga": formLiga,
  "add-fila": () => $("#filas").insertAdjacentHTML("beforeend", ACT._fila({})),
  "quitar-fila": t => t.closest(".liga-row").remove(),
  "nuevo-jugador": () => formJugador(null),
  "editar-jugador": t => formJugador(jug(t.dataset.id)),
  "borrar-jugador": async t => { if(!confirm("¿Borrar este jugador?")) return; await S.store.del("jugadores", t.dataset.id); if(S.session.me === t.dataset.id){ S.session.me = null; guardarSesion(); } cerrarSheet(); toast("Jugador borrado"); },
  foto: t => { fotoPara = t.dataset.id; $("#foto-input").click(); },
  quien: abrirQuienSoy,
  soy: t => { S.session.me = t.dataset.id; guardarSesion(); cerrarSheet(); render(); toast("¡Hola, " + (jug(t.dataset.id)?.nombre || "") + "!"); },
  "admin-salir": () => { S.session.admin = false; guardarSesion(); render(); },
  salir: () => { S.store?.stop(); S.store = null; S.team = null; S.session = null; LS.del("ecf-sesion"); S.tab = "partidos"; renderLogin(); }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if(!t) return;
  const fn = ACT[t.dataset.act]; if(fn){ e.preventDefault(); fn(t, e); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && S.sheet !== null) cerrarSheet(); });

const FORMS = {
  login: fm => {
    const c = fm.clave.value.trim().toLowerCase();
    const eq = CONFIG.equipos.find(x => x.clave.toLowerCase() === c);
    if(!eq) return renderLogin("Esa clave no es correcta. Pídesela al delegado.");
    S.session = { teamId: eq.id, me: null, admin: false }; guardarSesion(); entrar();
  },
  admin: fm => {
    if(fm.clave.value.trim().toLowerCase() === S.team.claveDelegado.toLowerCase()){ S.session.admin = true; guardarSesion(); render(); toast("Modo delegado activado"); }
    else toast("Clave de delegado incorrecta");
  },
  partido: async fm => {
    const d = Object.fromEntries(new FormData(fm));
    if(!d.rival.trim() || !d.fecha) return toast("Pon al menos el rival y la fecha");
    const goles = {};
    Object.keys(d).filter(k => k.startsWith("g_")).forEach(k => { const n = parseInt(d[k], 10); if(n > 0) goles[k.slice(2)] = n; });
    const p = {
      rival: d.rival.trim(), fecha: d.fecha, jornada: d.jornada, hora: d.hora, citacion: d.citacion,
      local: d.local === "1", equipacion: d.equipacion, campo: d.campo.trim(), direccion: d.direccion.trim(), notas: d.notas.trim(),
      gf: d.gf === "" ? "" : Math.max(0, +d.gf), gc: d.gc === "" ? "" : Math.max(0, +d.gc), goles
    };
    const suma = Object.values(goles).reduce((a, b) => a + b, 0);
    if(p.gf !== "" && suma > p.gf && !confirm(`Has apuntado ${suma} goles a jugadores pero el marcador dice ${p.gf}. ¿Guardar igualmente?`)) return;
    const id = fm.dataset.id || "p" + uid();
    await S.store.set("partidos", id, p);
    abrirSheet(htmlPartido({ id, ...p }), { tipo: "partido", id, live: true });
    toast("Partido guardado");
  },
  liga: async fm => {
    const filas = [...fm.querySelectorAll("#filas .liga-row")].map(r => {
      const o = { equipo: r.querySelector('[name="equipo"]').value.trim() };
      ["pg","pe","pp","gf","gc"].forEach(k => o[k] = Math.max(0, parseInt(r.querySelector(`[name="${k}"]`).value, 10) || 0));
      return o;
    }).filter(o => o.equipo);
    await S.store.set("liga", "tabla", { filas, actualizado: Date.now() });
    cerrarSheet(); toast("Clasificación guardada");
  },
  jugador: async fm => {
    const id = fm.dataset.id || "j" + uid();
    const prev = jug(id) || {};
    await S.store.set("jugadores", id, { ...prev, nombre: fm.nombre.value.trim(), dorsal: fm.dorsal.value });
    cerrarSheet(); toast("Jugador guardado");
  }
};
document.addEventListener("submit", e => {
  const fm = e.target.closest("[data-form]"); if(!fm) return;
  e.preventDefault(); FORMS[fm.dataset.form]?.(fm);
});

/* ---------- Arranque ---------- */
(async function boot(){
  S.online = await initFirebase();
  if(S.session?.teamId) entrar(); else renderLogin();
})();
</script>
