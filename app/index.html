<style>
:root{
  --azul:#1450B4; --azul-2:#0F3F8F; --marino:#0A2A63; --rojo:#D62839; --oro:#F2B705;
  --bg:#EEF3FA; --card:#FFFFFF; --ink:#0E1B33; --muted:#5B6B86; --line:#D6DFEC; --soft:#E3EBF7;
  --ok:#168A4A; --ko:#C2283A; --draw:#8A7A1A;
  --on-azul:#FFFFFF;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --azul:#3D7BE0; --azul-2:#2C62BD; --marino:#0A1A3A;
    --bg:#08111F; --card:#111F38; --ink:#E8EEF8; --muted:#97A6C2; --line:#22355A; --soft:#172A4B;
    --ok:#3FBF77; --ko:#F0596A; --draw:#D6C35A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --azul:#3D7BE0; --azul-2:#2C62BD; --marino:#0A1A3A;
  --bg:#08111F; --card:#111F38; --ink:#E8EEF8; --muted:#97A6C2; --line:#22355A; --soft:#172A4B;
  --ok:#3FBF77; --ko:#F0596A; --draw:#D6C35A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--azul)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
img{max-width:100%}
.stripes{background:repeating-linear-gradient(90deg,var(--azul) 0 26px,#fff 26px 40px)}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;line-height:1}

/* Login */
.login{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.login-band{height:34vh;min-height:200px;position:relative;display:flex;align-items:flex-end;padding:20px clamp(14px,4vw,24px)}
.crest{background:var(--marino);color:#fff;padding:16px 20px 18px;border-radius:4px 4px 18px 18px;box-shadow:0 10px 30px rgba(10,42,99,.35);max-width:min(26rem,100%);min-width:0;display:flex;align-items:center;gap:clamp(10px,3vw,16px)}
.escudo{flex:none;border-radius:50%;display:block;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 6px 18px rgba(0,0,0,.35)}
.crest .escudo{width:clamp(60px,18vw,88px);height:clamp(60px,18vw,88px)}
.top-inner .escudo{width:38px;height:38px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.crest h1{font-size:clamp(1.8rem,8.5vw,2.6rem);font-weight:900;text-transform:uppercase}
.crest p{margin:.35rem 0 0;color:#C9D7F2;font-size:.85rem}
.login-body{padding:24px clamp(14px,4vw,24px) 40px;max-width:30rem;width:100%}
.login-body .input{min-width:0}
.login-body label{display:block;font-weight:600;margin-bottom:8px}
.hint{color:var(--muted);font-size:.9rem;margin-top:14px}
.hint code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.88rem}
.err{color:var(--ko);font-weight:600;margin-top:10px;min-height:1.4em}

/* Inputs & buttons */
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:1rem}
.input:focus{border-color:var(--azul);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--azul);color:var(--on-azul);text-decoration:none;font-size:.95rem}
.btn.block{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.red{background:var(--rojo);color:#fff}
.btn.small{padding:7px 11px;font-size:.84rem;border-radius:10px}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .stripes{height:10px}
.top-inner{background:var(--marino);color:#fff;padding:10px max(14px,calc((100% - 64rem) / 2));display:flex;align-items:center;gap:12px}
.top-inner > div{min-width:0}
.top-inner h1{font-size:1.4rem;font-weight:900;text-transform:uppercase}
.top-inner small{display:block;color:#C9D7F2;font-size:.76rem;margin-top:2px;font-family:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acc{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.salir-btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.8rem}
.salir-btn svg{width:17px;height:17px}
.salir-btn:hover{background:rgba(255,255,255,.18)}
.badge-admin{background:var(--oro);color:#2a2100;font-weight:700;font-size:.75rem;padding:4px 8px;border-radius:999px}

main{max-width:44rem;margin:0 auto;padding:16px 14px 100px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.section-h h2{font-size:1.3rem;font-weight:800}
.muted{color:var(--muted)}

/* Next match hero */
.hero{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.hero-top{position:relative;padding:14px 16px 16px;color:var(--on-azul);background:var(--azul)}
.hero-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.13) 34px 50px);pointer-events:none}
.hero-top > *{position:relative;z-index:1}
.hero-label{font-weight:600;font-size:.8rem;opacity:.9}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin:10px 0 4px}
.vs .t{font-family:var(--display);font-weight:900;font-size:clamp(1.05rem,4.4vw,1.4rem);line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.vs .t.r{text-align:right}
.vs .x{font-family:var(--display);font-weight:800;font-size:.9rem;opacity:.8}
.when{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,5.6vw,1.75rem);line-height:1.05;margin-top:10px}
.cap1::first-letter{text-transform:uppercase}
.hero-body{padding:14px 16px 16px;display:grid;gap:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fact b{display:block;font-size:1rem;overflow-wrap:anywhere}
.fact span{color:var(--muted);font-size:.78rem}
.kit{display:flex;align-items:center;gap:10px}
.kit svg{flex:none}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-open{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 14px;background:none;border:0;text-align:left}
.map-link{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-right:10px;border-radius:12px;background:var(--soft);color:var(--azul)}
.map-link svg{width:21px;height:21px}
.aviso{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--oro) 20%,var(--card));border:1px solid color-mix(in srgb,var(--oro) 55%,transparent);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.aviso > svg{flex:none;width:24px;height:24px;color:#B98A00}
.aviso b{display:block;font-size:.92rem}
.aviso span{font-size:.8rem;color:var(--muted)}
.progreso{margin-bottom:12px}
.progreso span{font-size:.85rem;font-weight:600}
.enviado{display:grid;gap:2px;padding:10px 12px;border-radius:12px;margin-bottom:10px;background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.enviado b{color:var(--ok)}
.enviado span{font-size:.82rem;color:var(--muted)}
.notas button:disabled{cursor:default;opacity:.55}
.notas button.on:disabled{opacity:1}
.btn:disabled{opacity:.5;cursor:default}
.btn.wa{background:#1FA855;color:#fff}
.conv-texto{font-size:.85rem;line-height:1.4;margin-top:6px;resize:vertical;font-family:var(--body)}
.vrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.vname{min-width:0;font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.notas{flex:none;display:flex;gap:5px}
.notas button{width:46px;height:40px;border:1.5px solid var(--line);background:var(--card);border-radius:11px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:1px}
.notas button span{color:var(--oro);font-size:.85rem}
.notas button.on{border-color:var(--oro);background:color-mix(in srgb,var(--oro) 22%,var(--card))}
.previa h3{font-size:1.05rem;font-weight:800;margin:0 0 6px}
.previa p{margin:0;font-size:.9rem}
.previa .animo{margin-top:8px;font-weight:600;color:var(--azul)}
.input.pin{letter-spacing:.4em;font-size:1.3rem;text-align:center;font-weight:700;min-width:0}
.goals.pts::after{content:" pts";font-size:.8rem;font-family:var(--body);font-weight:600;color:var(--muted)}
.date-chip{flex:none;width:44px;text-align:center;border-radius:10px;background:var(--soft);padding:5px 0}
.date-chip b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1}
.date-chip span{font-size:.68rem;color:var(--muted);text-transform:capitalize}
.item .main{flex:1;min-width:0}
.item .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.93rem}
.item .main span{font-size:.78rem;color:var(--muted)}
.score{flex:none;font-family:var(--display);font-weight:900;font-size:1.3rem;padding:2px 8px;border-radius:9px;min-width:52px;text-align:center}
.score.w{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.score.l{background:color-mix(in srgb,var(--ko) 16%,transparent);color:var(--ko)}
.score.d{background:color-mix(in srgb,var(--draw) 18%,transparent);color:var(--draw)}

.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Table */
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px clamp(3px,1.2vw,8px);text-align:center;font-size:.86rem}
th{color:var(--muted);font-weight:600;font-size:.72rem;border-bottom:1px solid var(--line)}
td.eq,th.eq{text-align:left}
td.eq{line-height:1.25}
td.pos{font-family:var(--display);font-weight:800;font-size:1.05rem;width:28px}
td.pts{font-family:var(--display);font-weight:900;font-size:1.1rem}
tr.us td{background:color-mix(in srgb,var(--azul) 12%,transparent)}
tr.us td.eq{font-weight:700}
tbody tr+tr td{border-top:1px solid var(--line)}

/* Scorers */
.scorer{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.scorer:first-child{border-top:0}
.scorer .rank{font-family:var(--display);font-weight:800;font-size:1.3rem;width:24px;color:var(--muted)}
.scorer .goals{margin-left:auto;font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;color:var(--azul)}
.scorer.top1{background:linear-gradient(90deg,color-mix(in srgb,var(--oro) 22%,transparent),transparent)}
.scorer.top1 .rank{color:var(--ink)}

/* Avatars */
.av{flex:none;border-radius:50%;background:var(--azul);color:var(--on-azul);display:grid;place-items:center;font-weight:700;overflow:hidden;font-family:var(--display);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Players grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;text-align:center;position:relative}
.pcard.me{border:2px solid var(--azul)}
.pcard .num{position:absolute;top:8px;left:11px;font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--azul)}
.pcard .av{margin:0 auto 10px}
.pcard b{display:block;font-size:.93rem;overflow-wrap:anywhere}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:.8rem;color:var(--muted)}
.stats strong{color:var(--ink)}
.pcard .actions{margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* Stars */
.stars{color:var(--oro);letter-spacing:1px}

/* MVP */
.vote-list{display:grid;gap:8px}
.vote{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;width:100%}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--azul);border-radius:99px}
.mvp-win{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--oro) 18%,var(--card))}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:44rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);min-width:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--azul)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(5,15,35,.55)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px clamp(12px,4vw,18px) calc(28px + env(safe-area-inset-bottom,0px));max-width:44rem;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}

.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:1.5rem;font-weight:900;min-width:0;overflow-wrap:anywhere}
.x-btn{flex:none;border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:1.3rem;line-height:1}
.block:not(.btn){background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3.5vw,16px);margin-bottom:12px}
.block:not(.btn) h3{font-size:1.1rem;font-weight:800;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid .full{grid-column:1/-1}
.f label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.goal-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.goal-row input{width:72px;text-align:center}
.goal-row label{flex:none;width:52px;font-size:.85rem;font-weight:600;color:var(--muted)}
.convoca{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1.5px solid var(--line);border-radius:99px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--card)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--azul);background:color-mix(in srgb,var(--azul) 14%,var(--card))}
.chip:has(input:focus-visible){outline:3px solid var(--oro);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:12px;margin-bottom:6px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(10,30,70,.12)}
.conv-list{margin:0;padding:0;list-style:none;counter-reset:c;columns:2 12rem;column-gap:14px}
.conv-list li{counter-increment:c;display:flex;align-items:center;gap:8px;padding:4px 0;break-inside:avoid;font-size:.9rem;font-weight:600}
.conv-list li::before{content:counter(c);width:18px;text-align:right;font-family:var(--display);font-weight:800;color:var(--muted)}
.conv-list li small{color:var(--muted);font-weight:500}
.conv-list li.yo{color:var(--azul)}
.liga-edit input{padding:8px 3px;border-radius:8px;text-align:center;min-width:0}
.liga-edit .eqn{text-align:left}
.liga-edit input[type=number]{-moz-appearance:textfield;appearance:textfield}
.liga-edit input::-webkit-inner-spin-button,.liga-edit input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.liga-row{display:grid;grid-template-columns:minmax(78px,1fr) repeat(5,minmax(26px,44px)) 28px;gap:4px;align-items:center;margin-bottom:6px}
.liga-head{font-size:.75rem;color:var(--muted);font-weight:600;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.demo-note{font-size:.8rem;background:color-mix(in srgb,var(--oro) 20%,var(--card));border-radius:12px;padding:10px 12px;margin-bottom:14px}
/* Pantallas pequeñas */
@media (max-width:360px){
  .form-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .tab{font-size:.62rem}
  .salir-btn span{display:none}
  .salir-btn{padding:6px 8px}
  .notas button{width:40px}
  .map-link{width:36px;height:36px;margin-right:8px}
}
/* Ordenador y tableta grande: dos columnas y barra de pestañas flotante */
@media (min-width:960px){
  main{max-width:64rem;padding:24px 24px 120px}
  .cols{display:grid;grid-template-columns:minmax(0,24rem) minmax(0,1fr);gap:28px;align-items:start}
  .col-a{position:sticky;top:84px}
  .cols:has(> .col-a:empty){grid-template-columns:minmax(0,1fr)}
  .col-b > .section-h:first-child{margin-top:4px}
  .tabbar{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:min(30rem,calc(100% - 32px));border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(10,30,70,.18);padding-bottom:0}
  .tab{font-size:.74rem;padding:9px 2px 10px}
  .sheet-panel{bottom:auto;top:50%;transform:translateY(-50%);max-height:86vh;border-radius:20px;padding-bottom:24px;animation:none}
  .grab{display:none}
  .toast{bottom:96px}
}

/* ---------- Almacenamiento ---------- */
function semilla(teamId){
  const sab = new Date(); sab.setDate(sab.getDate() + ((6 - sab.getDay() + 7) % 7 || 7));
  sab.setMinutes(sab.getMinutes() - sab.getTimezoneOffset());
  const nombre = { alevin: "Markel", benjamin: "Martin" }[teamId] || "Jugador";
  const j1 = "j" + uid();
  return {
    jugadores: { [j1]: { nombre, dorsal: "" } },
    partidos: { ["p" + uid()]: {
      jornada: "1", fecha: sab.toISOString().slice(0,10), hora: "10:30", citacion: "10:00",
      rival: "Rival de ejemplo", local: true, campo: "Campo municipal de Espartinas",
      direccion: "Espartinas, Sevilla", equipacion: "azul", notas: "Partido de ejemplo: el delegado puede editarlo o borrarlo."
    }},
    votos: {},
    liga: { tabla: { filas: [{ equipo: CONFIG.club, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 }] } }
  };
}
class LocalStore {
  constructor(team){ this.key = LSK + "-datos-" + team; this.cbs = {}; this.data = LS.get(this.key, null); if(!this.data){ this.data = semilla(team); this.save(); } }
  save(){ if(!LS.set(this.key, this.data)) toast("No hay espacio para guardar en este móvil"); }
  list(c){ return Object.entries(this.data[c] || {}).map(([id, v]) => ({ id, ...v })); }
  emit(c){ (this.cbs[c] || []).forEach(cb => cb(this.list(c))); }
  watch(c, cb){ (this.cbs[c] = this.cbs[c] || []).push(cb); cb(this.list(c)); }
  async set(c, id, v){ const { id: _, ...body } = v; (this.data[c] = this.data[c] || {})[id] = body; this.save(); this.emit(c); }
  async del(c, id){ if(this.data[c]) delete this.data[c][id]; this.save(); this.emit(c); }
  stop(){ this.cbs = {}; }
}
class FireStore {
  constructor(team){ this.base = "equipos/" + team; this.unsubs = []; this.db = firebase.firestore(); }
  watch(c, cb){
    this.unsubs.push(this.db.collection(this.base + "/" + c).onSnapshot(
      s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))),
      () => toast("No se pudo conectar con la base de datos")
    ));
  }
  set(c, id, v){ const { id: _, ...body } = v; return this.db.collection(this.base + "/" + c).doc(id).set(body); }
  del(c, id){ return this.db.collection(this.base + "/" + c).doc(id).delete(); }
  stop(){ this.unsubs.forEach(u => u()); this.unsubs = []; }
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function initFirebase(){
  if(!CONFIG.firebase) return false;
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js");
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js");
    firebase.initializeApp(CONFIG.firebase);
    return true;
  }catch(e){ return false; }
}

/* ---------- Estado ---------- */
const S = {
  online: false, session: LS.get(LSK + "-sesion", null), team: null, store: null,
  jugadores: [], staff: [], partidos: [], votos: [], liga: [],
  tab: "partidos", sheet: null
};
const guardarSesion = () => LS.set(LSK + "-sesion", S.session);

/* ---------- Utilidades de datos ---------- */
const jug = id => S.jugadores.find(j => j.id === id) || S.staff.find(j => j.id === id);
// El Mister es un usuario de la colección jugadores con rol "mister": entra con nombre y PIN,
// tiene permisos de delegado y no cuenta como jugador (ni convocatorias, ni votos, ni rankings).
const esMister = id => jug(id)?.rol === "mister";
const jugadoresOrden = () => [...S.jugadores].sort((a, b) => (Number(a.dorsal) || 99) - (Number(b.dorsal) || 99) || a.nombre.localeCompare(b.nombre));
const jugado = p => p.gf !== undefined && p.gf !== null && p.gf !== "";
const fechaDe = p => new Date((p.fecha || "2100-01-01") + "T" + (p.hora || "12:00"));
const proximos = () => S.partidos.filter(p => !jugado(p) && (p.fecha || "") >= hoyISO()).sort((a, b) => fechaDe(a) - fechaDe(b));
const jugados = () => S.partidos.filter(p => jugado(p)).sort((a, b) => fechaDe(b) - fechaDe(a));
const pendientes = () => S.partidos.filter(p => !jugado(p) && (p.fecha || "") < hoyISO()).sort((a, b) => fechaDe(b) - fechaDe(a));
// Goles: si la liga publica sus goleadores (liga/goleadores, p. ej. gesliga) mandan esos;
// cada fila se une a un jugador por su «nombre en la liga» o por un nombre parecido.
const normaNombre = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/gª/g, "garcia").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
function jugadorDeLiga(nombre){
  const n = normaNombre(nombre);
  const exacto = S.jugadores.find(j => normaNombre(j.nombreLiga) === n) || S.jugadores.find(j => normaNombre(j.nombre) === n);
  if(exacto) return exacto;
  // «Javi Castellanos» ~ «Javier Castellano»: nombre y último apellido empiezan igual
  const [a, ...r] = n.split(" "), z = r.pop();
  if(!z) return null;
  const parecidos = S.jugadores.filter(j => { const [b, ...q] = normaNombre(j.nombre).split(" "), y = q.pop();
    return y && (a.startsWith(b) || b.startsWith(a)) && (z.startsWith(y) || y.startsWith(z)); });
  return parecidos.length === 1 && !normaNombre(parecidos[0].nombreLiga) ? parecidos[0] : null;
}
const goleadoresLiga = () => { const d = S.liga.find(x => x.id === "goleadores"); return d?.filas?.length ? d : null; };
const golesDe = jid => {
  const gl = goleadoresLiga();
  if(gl) return gl.filas.filter(f => jugadorDeLiga(f.nombre)?.id === jid).reduce((n, f) => n + (+f.goles || 0), 0);
  return S.partidos.reduce((n, p) => n + (Number(p.goles?.[jid]) || 0), 0);
};
// Votaciones: en cada partido jugado cada convocado da 3, 4 o 5 estrellas a cada compañero convocado
// (si el partido no tiene convocatoria, participa toda la plantilla). Solo se muestran sumas.
// Documento votos/{partido}_{votante} = { partido, votante, notas: { [jugador]: 3|4|5 }, enviado }.
const miVoto = (pid, jid) => S.votos.find(v => v.partido === pid && v.votante === jid);
const partidoDe = pid => S.partidos.find(x => x.id === pid);
const participantes = p => (p?.convocados || []).length ? jugadoresOrden().filter(j => p.convocados.includes(j.id)) : jugadoresOrden();
const participa = (p, jid) => participantes(p).some(j => j.id === jid);
const companeros = (p, jid) => participantes(p).filter(j => j.id !== jid);
// Un voto solo existe en la base de datos cuando se envía (y ya no se puede cambiar).
// Mientras tanto es un borrador guardado en el propio móvil.
const votoCompleto = (pid, jid) => !!miVoto(pid, jid);
const claveBorrador = (pid, jid) => `${LSK}-borrador-${S.team?.id}-${jid}-${pid}`;
const borrador = (pid, jid) => LS.get(claveBorrador(pid, jid), {});
function puntosPartido(pid){
  const p = partidoDe(pid), t = {};
  S.votos.filter(v => v.partido === pid && participa(p, v.votante))
    .forEach(v => Object.entries(v.notas || {}).forEach(([j, n]) => { if(participa(p, j)) t[j] = (t[j] || 0) + (+n || 0); }));
  return t;
}
function mvpPartido(pid){ const t = puntosPartido(pid); const max = Math.max(0, ...Object.values(t)); return max ? Object.keys(t).filter(k => t[k] === max) : []; }
const puntosDe = jid => jugados().reduce((n, p) => n + (puntosPartido(p.id)[jid] || 0), 0);
const mvpsDe = jid => jugados().filter(p => mvpPartido(p.id).includes(jid)).length;
const votantes = pid => participantes(partidoDe(pid)).filter(j => votoCompleto(pid, j.id));
const pendientesDeVotar = jid => jid && jug(jid) ? jugados().filter(p => participa(p, jid) && companeros(p, jid).length && !votoCompleto(p.id, jid)) : [];
const fechaLarga = p => fechaDe(p).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
// Ubicación: el enlace de Maps que publica la liga; si no, la dirección que ponga el delegado;
// en casa, nuestro campo; fuera, el nombre del campo.
const destino = p => p.direccion || p.campo || "";
const rutaA = texto => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(texto);
const mapsUrl = p => p.mapa || (p.direccion ? rutaA(p.direccion) : CONFIG.sede ? rutaA(CONFIG.sede) : p.local ? CONFIG.mapaCasa : p.campo ? rutaA(p.campo) : "");
// Nombre del sitio del partido; con sede fija, «Colegio Claret Sevilla · Campo 1»
const nombreCampo = (p, porConfirmar = "Campo por confirmar") => CONFIG.sede ? CONFIG.sede + (p.campo ? " · " + p.campo : "")
  : p.campo || (p.local ? "Campo del " + CONFIG.club : porConfirmar);
const equipos = p => p.local ? [CONFIG.club, p.rival] : [p.rival, CONFIG.club];
function resultado(p){ if(!jugado(p)) return ""; const gf = +p.gf, gc = +p.gc; return gf > gc ? "w" : gf < gc ? "l" : "d"; }
const marcador = p => p.local ? `${p.gf}-${p.gc}` : `${p.gc}-${p.gf}`;

function entrar(){
  const eq = CONFIG.equipos.find(e => e.id === S.session?.teamId);
  if(!eq){ S.session = null; LS.del(LSK + "-sesion"); return renderLogin(); }
  S.team = eq;
  if(S.session.me && !S.session.pinOk){ S.session.me = null; guardarSesion(); }
  S.store?.stop();
  S.store = S.online ? new FireStore(eq.id) : new LocalStore(eq.id);
  let primera = true;
  COLLS.forEach(c => S.store.watch(c, rows => {
    if(c === "jugadores"){ S.staff = rows.filter(r => r.rol); S.jugadores = rows.filter(r => !r.rol); }
    else S[c] = rows;
    render();

    if(primera && c === "jugadores"){ primera = false; if(!S.session.me && rows.length) setTimeout(abrirQuienSoy, 300); }

function filasLiga(){

    const pts = Number.isFinite(+f.pts) && f.pts !== "" && f.pts != null ? +f.pts : pg * 3 + pe;
    const dg = f.dif != null && f.dif !== "" ? +f.dif : gf - gc; // la Liga Educa solo da la diferencia
    return { ...f, pg, pe, pp, gf, gc, pj, pts, dg };
  }).sort((a, b) => (+a.pos || 0) - (+b.pos || 0) || b.pts - a.pts || b.dg - a.dg || b.gf - a.gf); // orden oficial si viene «pos»
}

function vRanking(){
  const vista = S.rankVista === "goles" ? "goles" : "puntos";
  let html = avisoVotos() + `<div class="seg" role="tablist">${[["puntos", "Puntuación"], ["goles", "Goleadores"]].map(([k, l]) =>
    `<button role="tab" class="${vista === k ? "on" : ""}" aria-selected="${vista === k}" data-act="rank-vista" data-v="${k}">${l}</button>`).join("")}</div>`;
  if(vista === "goles") return html + vGoles();
  const nj = jugados().length;
  const tabla = conPosiciones(S.jugadores.map(j => ({ j, pts: puntosDe(j.id), mvp: mvpsDe(j.id) }))
    .sort((a, b) => b.pts - a.pts || b.mvp - a.mvp || a.j.nombre.localeCompare(b.j.nombre)), "pts");
  html += `<div class="section-h" style="margin-top:6px"><h2>Ranking de puntuación</h2><span class="muted">${nj} ${nj === 1 ? "partido" : "partidos"}</span></div>`;
  html += !tabla.some(x => x.pts) ? `<div class="empty"><b>Aún no hay votos</b>Después de cada partido, cada jugador vota a sus compañeros con 3, 4 o 5 estrellas. Aquí se suman todos los puntos.</div>`
    : `<div class="list">${tabla.map(x => filaRanking(x.pos, x.j, x.pts, x.mvp ? `${x.mvp} ${x.mvp === 1 ? "vez" : "veces"} MVP` : "", "pts")).join("")}</div>
       <p class="muted" style="font-size:.8rem">Los votos son secretos: solo se ve la suma de puntos. El MVP de cada partido es quien más puntos saca.</p>`;
  return html;
}
function vGoles(){
  const gl = goleadoresLiga();
  const lista = (gl ? gl.filas.map(f => ({ j: jugadorDeLiga(f.nombre) || { nombre: f.nombre, liga: true }, g: +f.goles || 0 }))
    : S.jugadores.map(j => ({ j, g: golesDe(j.id) }))).filter(x => x.g > 0).sort((a, b) => b.g - a.g || a.j.nombre.localeCompare(b.j.nombre));
  const total = jugados().reduce((n, p) => n + (+p.gf || 0), 0);
  let html = `<div class="section-h" style="margin-top:6px"><h2>Ranking de goleadores</h2><span class="muted">${total} goles del equipo</span></div>`;
  if(!lista.length) return html + `<div class="empty"><b>Todavía no hay goles apuntados</b>Aparecerán aquí en cuanto se metan los resultados.</div>`;
  let pos = 0, prev = null;
  html += `<div class="list">${lista.map((x, i) => { if(x.g !== prev){ pos = i + 1; prev = x.g; }
    return `<div class="scorer ${pos === 1 ? "top1" : ""}"><span class="rank">${pos}</span>${avatar(x.j, 44)}<div><b>${esc(x.j.nombre)}</b>${x.j.liga ? `<div class="muted" style="font-size:.8rem">Así sale en la liga${S.session.admin ? ": ponlo en «Nombre en la liga» del jugador" : ""}</div>` : x.j.dorsal ? `<div class="muted" style="font-size:.85rem">Dorsal ${esc(x.j.dorsal)}</div>` : ""}</div><span class="goals">${x.g}</span></div>`; }).join("")}</div>`;
  if(gl) html += `<p class="muted" style="font-size:.8rem">Goles oficiales de la web de la liga, actualizados el ${new Date(+gl.actualizado).toLocaleDateString("es-ES", { day: "numeric", month: "long" })}.</p>`;
  return html;
}

function vEquipo(){
  const yo = S.session.me;
  let html = `<div class="section-h" style="margin-top:6px"><h2>Plantilla</h2>${S.session.admin ? `<button class="btn small" data-act="nuevo-jugador">Añadir jugador</button>` : ""}</div>`;
  if(!S.jugadores.length) return html + `<div class="empty"><b>Aún no hay jugadores</b>${S.session.admin ? "Añade la plantilla con el botón de arriba." : "El delegado añadirá la plantilla."}</div>`;
  html += `<div class="grid">${jugadoresOrden().map(j => {
    const puedeFoto = j.id === yo || S.session.admin;
    return `<div class="pcard ${j.id === yo ? "me" : ""}">
      ${j.dorsal ? `<span class="num">${esc(j.dorsal)}</span>` : ""}
      ${avatar(j, 76)}
      <b>${esc(j.nombre)}</b>
      <div class="stats"><span><strong>${golesDe(j.id)}</strong> goles</span><span><strong>${puntosDe(j.id)}</strong> puntos</span><span><strong>${mvpsDe(j.id)}</strong> MVP</span></div>
      ${S.session.admin ? `<div class="stats"><span>${j.pin ? "Tiene PIN propio" : `<strong style="color:var(--ko)">PIN 0000, sin estrenar</strong>`}</span></div>` : ""}
      ${puedeFoto || S.session.admin ? `<div class="actions">
        ${puedeFoto ? `<button class="btn small ghost" data-act="foto" data-id="${j.id}">${j.foto ? "Cambiar foto" : "Subir foto"}</button>` : ""}
        ${S.session.admin ? `<button class="btn small ghost" data-act="editar-jugador" data-id="${j.id}">Editar</button>` : ""}
      </div>` : ""}
    </div>`; }).join("")}</div>`;
  if(S.session.admin && S.staff.length){
    html += `<div class="section-h"><h2>Cuerpo técnico</h2></div><div class="list">${S.staff.map(j => `<div class="scorer">${avatar(j, 40)}<div class="grow" style="min-width:0"><b>${esc(j.nombre)}</b><div class="muted" style="font-size:.8rem">${j.pin ? "Tiene PIN propio" : "PIN 0000, sin estrenar"}</div></div>
      ${j.pin && j.id !== S.session.me ? `<button class="btn small ghost" data-act="pin-reset" data-id="${j.id}">Reiniciar PIN</button>` : ""}</div>`).join("")}</div>`;
  }
  return html;
}

    html += `<div class="row">${avatar(me, 64)}<div class="grow" style="min-width:0"><h3 style="margin:0">${esc(me.nombre)}</h3><span class="muted">Has entrado con tu PIN</span></div></div>
      <div class="facts" style="margin-top:14px">
        <div class="fact"><b>${puntosDe(me.id)}</b><span>Puntos de votos${puntosDe(me.id) && pos ? ` (${pos}º)` : ""}</span></div>
        <div class="fact"><b>${mvpsDe(me.id)}</b><span>Veces MVP</span></div>
        <div class="fact"><b>${golesDe(me.id)}</b><span>Goles</span></div>
        <div class="fact"><b>${votados} de ${jugados().length}</b><span>Partidos votados</span></div>
      </div>
      <div class="row wrap" style="margin-top:14px">
        <button class="btn small" data-act="foto" data-id="${me.id}">${me.foto ? "Cambiar mi foto" : "Subir mi foto"}</button>

  } else {
    html += `<h3>¿Quién eres?</h3><p class="muted" style="margin-top:0">Entra con tu nombre y tu PIN para votar y poner tu foto.</p>
      <button class="btn" data-act="quien" ${S.jugadores.length ? "" : "disabled"}>Entrar con mi nombre</button>`;
  }
  html += `</div>`;

  html += `<div class="block"><h3>Delegado</h3>`;
  if(S.session.admin){
    html += `<p class="muted" style="margin-top:0">Puedes editar partidos, convocatorias, resultados, goleadores, plantilla y clasificación, y reiniciar el PIN de un jugador.</p>
      <button class="btn small ghost" data-act="admin-salir">Salir del modo delegado</button>`;
  } else {
    html += `<form data-form="admin" class="row"><input class="input grow" name="clave" type="password" placeholder="Clave de delegado" autocomplete="off"><button class="btn" type="submit">Entrar</button></form>`;
  }
  html += `</div>`;
  html += `<div class="block"><h3>Equipo</h3><p class="muted" style="margin-top:0">${esc(CONFIG.club)}, ${esc(S.team.nombre)}. ${S.online ? "Datos compartidos con todo el equipo." : "Modo prueba: datos guardados solo en este dispositivo."}</p>
    <button class="btn small line" data-act="salir">Cambiar de equipo</button></div>`;

/* ---------- Hojas (detalles y formularios) ---------- */
function abrirSheet(html, opts = {}){ S.sheet = opts; $("#sheet-panel").innerHTML = `<div class="grab"></div>` + html; $("#sheet").classList.add("open"); document.body.style.overflow = "hidden"; }
function cerrarSheet(){ S.sheet = null; $("#sheet").classList.remove("open"); document.body.style.overflow = ""; }
function refrescarSheet(){
  if(S.sheet?.tipo === "partido"){
    const p = S.partidos.find(x => x.id === S.sheet.id);
    if(!p) return cerrarSheet();
    const panel = $("#sheet-panel"), top = panel.scrollTop;
    panel.innerHTML = `<div class="grab"></div>` + htmlPartido(p);
    panel.scrollTop = top;
  }
}
const cabecera = t => `<div class="sheet-h"><h2>${t}</h2><button class="x-btn" data-act="close" aria-label="Cerrar">×</button></div>`;

function htmlPartido(p){
  const [a, b] = equipos(p), r = resultado(p), me = S.session.me;
  let html = cabecera(r ? `${esc(a)} ${marcador(p)} ${esc(b)}` : `${esc(a)} – ${esc(b)}`);
  html += `<div class="block">
    <div class="facts">
      <div class="fact" style="grid-column:1/-1"><b class="cap1">${p.provisional ? "Semana del " + esc(fechaDe(p).toLocaleDateString("es-ES", { day: "numeric", month: "long" })) + " (por confirmar)" : esc(fechaLarga(p))}</b><span>${p.jornada ? "Jornada " + esc(p.jornada) + ", " : ""}${p.local ? "en casa" : "fuera"}</span></div>
      <div class="fact"><b>${esc(p.hora || "–")}</b><span>Hora del partido</span></div>
      <div class="fact"><b>${esc(p.citacion || "–")}</b><span>Hora de llegada</span></div>
      <div class="fact" style="grid-column:1/-1"><b>${esc(nombreCampo(p))}</b><span>${esc(p.direccion || "")}</span></div>
    </div>
    <div class="kit" style="margin-top:12px">${equipacion(p, 52)}<span>${esc(textoKit(p))}</span></div>
    ${p.notas ? `<p class="muted" style="margin-bottom:0">${esc(p.notas)}</p>` : ""}
    ${mapsUrl(p) ? `<a class="btn block" style="margin-top:14px" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">Cómo llegar con Google Maps</a>` : ""}
  </div>`;

  html += htmlConvocatoria(p);
  if(!jugado(p)){
    html += `<div class="block">${htmlPrevia(p)}</div><div class="block"><h3>Votaciones</h3><p class="muted" style="margin:0">Se abren cuando haya resultado.</p></div>`;
  } else {
    const goleadores = Object.entries(p.goles || {}).filter(([, n]) => +n > 0).sort((x, y) => y[1] - x[1]);
    html += `<div class="block"><h3>Goles del ${esc(CONFIG.corto)}</h3>${goleadores.length
      ? goleadores.map(([jid, n]) => `<div class="row" style="padding:5px 0">${avatar(jug(jid), 34)}<span class="grow">${esc(jug(jid)?.nombre || "Jugador")}</span><b>${"⚽".repeat(Math.min(+n, 6))}${+n > 6 ? " ×" + n : ""}</b></div>`).join("")
      : `<p class="muted" style="margin:0">${+p.gf ? "Sin goleadores apuntados." : "No marcamos en este partido."}</p>`}</div>`;

    html += bloqueVotos(p);
  }
  if(S.session.admin){
    html += `<div class="row"><button class="btn grow" data-act="editar-partido" data-id="${p.id}">${jugado(p) ? "Editar partido" : "Editar o poner resultado"}</button><button class="btn red" data-act="borrar-partido" data-id="${p.id}">Borrar</button></div>`;
  }
  return html;
}

// Convocatoria: el Mister o el delegado la prepara (borrador, solo la ven ellos) y la «lanza»:
// se guarda «lanzada» y se genera el mensaje de WhatsApp con todos los datos.
const convocadosDe = p => (p.convocados || []).map(jug).filter(Boolean);
const descansanDe = p => jugadoresOrden().filter(j => !(p.convocados || []).includes(j.id));
const convVisible = p => !!(p.lanzada || jugado(p) || S.session.admin);
function lugarTexto(p){ return CONFIG.sede ? "en " + nombreCampo(p) : p.local ? "en casa" : `${p.campo ? "en " + p.campo : "fuera"}, jugamos como visitantes`; }
function textoConvocatoria(p){
  const k = kitDe(p), l = [], desc = descansanDe(p), mapa = mapsUrl(p);
  const fecha = fechaLarga(p); 
  l.push(`⚽ *CONVOCATORIA – ${CONFIG.club}${S.team.nombre !== CONFIG.club ? " " + S.team.nombre : ""}*`);
  l.push(`${p.jornada ? "Jornada " + p.jornada + " · " : ""}${fecha.charAt(0).toUpperCase() + fecha.slice(1)}`);
  l.push(`🆚 ${p.rival || "Rival por confirmar"} (${p.local ? "en casa" : "fuera"})`, "");
  l.push(`🕐 *Citación:* ${p.citacion ? p.citacion + " h" : "por confirmar"}`);
  l.push(`⏱️ *Partido:* ${p.hora ? p.hora + " h" : "por confirmar"}`);
  l.push(`📍 *Campo:* ${nombreCampo(p, "por confirmar")}${p.direccion ? " (" + p.direccion + ")" : ""}`);
  if(mapa) l.push(`🗺️ Cómo llegar: ${mapa}`);
  l.push("", `*Convocados (${convocadosDe(p).length}):*`);
  convocadosDe(p).forEach((j, i) => l.push(`${i + 1}. ${j.nombre}`));
  if(desc.length) l.push("", "*Descansan:*", ...desc.map(j => j.nombre));
  l.push("", "*Equipación:*", `👕 Camiseta *${CAMISETAS[k.camiseta]}*`, `🩳 Pantalón *${PANTALONES[k.pantalon]}*`, `🧦 Medias *${MEDIAS[k.medias]}*`);
  if(S.team.notaConvocatoria) l.push("", S.team.notaConvocatoria);
  if(p.notas) l.push("", p.notas);
  if(CONFIG.enlaceApp) l.push("", `📲 Todo en la app: ${CONFIG.enlaceApp}`);
  l.push("", CONFIG.grito);
  return l.join("\n");
}
function htmlConvocatoria(p){
  const conv = convocadosDe(p); if(!conv.length || !convVisible(p)) return "";
  const desc = descansanDe(p), me = S.session.me, admin = S.session.admin, jug_ = jugado(p);
  const estado = admin && !jug_ ? (p.lanzada
      ? `<div class="enviado" style="margin:0 0 10px"><b>✓ Convocatoria lanzada</b><span>El ${new Date(+p.lanzada).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" })}. Las familias ya la ven.</span></div>`
      : `<div class="demo-note" style="margin:0 0 10px"><b>Borrador:</b> las familias aún no la ven. Cuando esté lista, pulsa «Lanzar convocatoria».</div>`) : "";
  const boton = admin && !jug_
    ? `<button class="btn block wa" style="margin-top:12px" data-act="lanzar-conv" data-id="${p.id}">${ICON.whatsapp}${p.lanzada ? "Volver a enviar por WhatsApp" : "Lanzar convocatoria"}</button>`
    : "";
  return `<div class="block conv"><div class="section-h" style="margin:0 0 8px"><h3 style="margin:0">Convocatoria</h3>${!admin ? `<button class="btn small ghost" data-act="compartir-conv" data-id="${p.id}">Compartir</button>` : ""}</div>
    ${estado}
    <p style="margin:0 0 10px"><b>${p.citacion ? "Citación " + esc(p.citacion) + " h" : "Citación por confirmar"}</b> · ${p.hora ? "partido " + esc(p.hora) + " h" : "hora del partido por confirmar"}, ${esc(lugarTexto(p))}</p>
    <ol class="conv-list">${conv.map(j => `<li class="${j.id === me ? "yo" : ""}">${avatar(j, 26)}<span>${esc(j.nombre)}</span>${j.dorsal ? `<small>${esc(j.dorsal)}</small>` : ""}</li>`).join("")}</ol>
    ${desc.length ? `<p class="muted" style="margin:10px 0 0;font-size:.85rem"><b>Descansan:</b> ${esc(desc.map(j => j.nombre).join(", "))}</p>` : ""}
    ${S.team.notaConvocatoria ? `<p class="muted" style="margin:8px 0 0;font-size:.8rem">${esc(S.team.notaConvocatoria)}</p>` : ""}
    ${boton}
  </div>`;
}
function abrirLanzar(p){
  const faltan = [!p.citacion && "la hora de citación", !p.hora && "la hora del partido", !p.local && !p.campo && !p.direccion && "el campo"].filter(Boolean);
  abrirSheet(`${cabecera("Lanzar convocatoria")}
    <div class="block">
      ${faltan.length ? `<div class="demo-note" style="margin:0 0 10px">Falta ${faltan.join(" y ")}. Puedes lanzarla igual o <button class="btn small ghost" data-act="editar-partido" data-id="${p.id}">completar el partido</button></div>` : ""}
      <label class="muted" for="conv-texto" style="font-size:.85rem;font-weight:600">Mensaje para el grupo (puedes retocarlo):</label>
      <textarea class="input conv-texto" id="conv-texto" rows="16">${esc(textoConvocatoria(p))}</textarea>
      <button class="btn block wa" style="margin-top:12px" data-act="conv-whatsapp" data-id="${p.id}">${ICON.whatsapp}Enviar por WhatsApp</button>
      <button class="btn block ghost" style="margin-top:8px" data-act="conv-copiar" data-id="${p.id}">Copiar el mensaje</button>
      <p class="muted" style="font-size:.8rem;margin:10px 0 0">Al enviarlo o copiarlo, la convocatoria queda lanzada y ${CONFIG.ninos ? "los niños" : "los jugadores"} la verán en la app.</p>
    </div>`, { tipo: "lanzar", id: p.id });
}
async function marcarLanzada(id){
  const p = S.partidos.find(x => x.id === id); if(!p || p.lanzada) return;
  const { id: _, ...datos } = p;
  await S.store.set("partidos", id, { ...datos, lanzada: Date.now() });
}

function bloqueVotos(p){
  const me = S.session.me, parts = participantes(p), total = parts.length;
  let html = `<div class="block"><h3>Votaciones</h3>`;
  if(total < 2) return html + `<p class="muted" style="margin:0">Hacen falta al menos dos jugadores.</p></div>`;
  const hecho = me && votoCompleto(p.id, me);
  if(me && esMister(me)){
    html += `<p class="muted" style="margin-top:0">Votan los ${total} ${(p.convocados || []).length ? "convocados" : "jugadores"}. El mister no vota.</p>`;
  } else if(me && !participa(p, me)){
    html += `<p class="muted" style="margin-top:0">En este partido descansabas, así que no votas. Votan los ${total} convocados.</p>`;
  } else if(me){
    const enviado = miVoto(p.id, me), notas = enviado?.notas || borrador(p.id, me);
    const comp = companeros(p, me).filter(j => !enviado || notas[j.id]);
    const llevo = comp.filter(j => notas[j.id]).length, completo = llevo === comp.length;
    html += enviado
      ? `<div class="enviado"><b>✓ Votación enviada</b><span>Ya no se puede cambiar. Estos fueron tus votos (solo los ves tú):</span></div>`
      : `<p class="muted" style="margin-top:0">Vota a todos tus compañeros con 3, 4 o 5 estrellas y pulsa «Enviar votación». Tus votos son secretos.</p>
      <div class="progreso"><span>${completo ? "¡Has votado a todos! Ya puedes enviarla." : `Llevas ${llevo} de ${comp.length}`}</span><div class="bar"><i style="width:${Math.round(llevo / comp.length * 100)}%"></i></div></div>`;
    html += `<div class="vote-list">${comp.map(j => `<div class="vrow">${avatar(j, 34)}<span class="grow vname">${esc(j.nombre)}</span><div class="notas" role="group" aria-label="Nota para ${esc(j.nombre)}">
        ${[3, 4, 5].map(n => `<button class="${notas[j.id] === n ? "on" : ""}" ${enviado ? "disabled" : `data-act="nota" data-id="${p.id}" data-j="${j.id}" data-n="${n}"`} aria-pressed="${notas[j.id] === n}">${n}<span>★</span></button>`).join("")}
      </div></div>`).join("")}</div>`;
    if(!enviado) html += `<button class="btn block" style="margin-top:12px" data-act="enviar-votos" data-id="${p.id}" ${completo ? "" : "disabled"}>${completo ? "Enviar votación" : `Enviar votación (te faltan ${comp.length - llevo})`}</button>`;
  } else {
    html += `<p class="muted" style="margin-top:0">Entra con tu nombre y tu PIN para votar.</p><button class="btn small" data-act="quien">Entrar con mi nombre</button>`;
  }
  const hanVotado = votantes(p.id);
  html += `<p class="muted" style="font-size:.85rem;margin:12px 0 0">Han votado ${hanVotado.length} de ${total}${(p.convocados || []).length ? " convocados" : ""}.${S.session.admin && hanVotado.length < total ? " Faltan: " + esc(parts.filter(j => !hanVotado.some(v => v.id === j.id)).map(j => j.nombre).join(", ")) + "." : ""}</p>`;
  html += `</div>`;
  // Ranking del partido: se ve cuando has votado a todos (el delegado siempre)
  const pts = puntosPartido(p.id), lista = Object.entries(pts).sort((x, y) => y[1] - x[1]);
  if(lista.length && (hecho || S.session.admin)){
    const max = lista[0][1], mvp = mvpPartido(p.id);
    html += `<div class="block"><h3>Ranking del partido</h3>
      ${mvp.map(id => `<div class="mvp-win" style="margin-bottom:10px">${avatar(jug(id), 44)}<div><b>${esc(jug(id)?.nombre || "Jugador")}</b><div class="muted" style="font-size:.8rem">${mvp.length > 1 ? "MVP empatado" : "MVP del partido"}, ${max} puntos</div></div></div>`).join("")}

// Previa para los niños: cómo llega el rival según la clasificación y una frase de ánimo.
const ANIMO = CONFIG.animo || [
  "Lo más importante: correr, pasarse el balón y pasarlo en grande. ¡Vamos, Espartinas!",
  "Da igual el marcador: si lo dais todo y os divertís, ya habéis ganado. ¡A disfrutar!",
  "Cada partido es una aventura nueva. Jugad con alegría y animad siempre a los compañeros.",
  "Un equipo de verdad se ayuda siempre, también cuando algo sale mal. ¡A pasarlo bien!",
  "Respirad hondo, sonreíd y celebrad cada buen pase. ¡Aúpa Espartinas!",
  "Hoy toca aprender, jugar juntos y divertirse mucho. ¡Y al final, a saludar al rival y al árbitro!"
];
const mismoEquipo = (a, b) => norma(a) === norma(b);
const norma = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
function previa(p){
  const filas = filasLiga().map((f, i) => ({ ...f, pos: +f.pos || i + 1 }));
  const r = filas.find(f => mismoEquipo(f.equipo, p.rival)), yo = filas.find(f => CONFIG.patron.test(f.equipo));
  const frases = [];
  if(!r || !r.pj){
    frases.push(`El ${p.rival} todavía no ha jugado en la liga, así que será una sorpresa para todos.`);
  } else {
    const balance = [r.pg && `${r.pg === 1 ? "ganado uno" : "ganado " + r.pg}`, r.pe && `${r.pe === 1 ? "empatado uno" : "empatado " + r.pe}`, r.pp && `${r.pp === 1 ? "perdido uno" : "perdido " + r.pp}`].filter(Boolean);
    frases.push(`El ${p.rival} va ${r.pos}º con ${r.pts} ${r.pts === 1 ? "punto" : "puntos"}: ha ${balance.length > 1 ? balance.slice(0, -1).join(", ") + " y " + balance.slice(-1) : balance[0]}.`);
    if(r.pos <= 3 || (yo && r.pts - yo.pts >= 6)) frases.push("Es de los equipos de arriba: tocará correr mucho, ayudarse en defensa y no rendirse nunca.");
    else if(yo && yo.pts - r.pts >= 6) frases.push("Es un rival al que le está costando: si movemos rápido el balón tendremos muchas ocasiones, pero hay que respetarle siempre.");
    else frases.push("Será un partido igualado, de esos en los que cada balón cuenta.");
    if(r.dg >= 6) frases.push("Marcan bastantes goles, así que ¡atentos atrás y a ayudar al portero!");
    else if(r.dg <= -6) frases.push("Les están marcando bastantes goles: ¡a probar a puerta siempre que podáis!");
  }
  if(!CONFIG.sede) frases.push(p.local ? "Jugamos en casa: ¡que se oiga a nuestra gente!" : `Jugamos fuera: llevamos la alegría del ${CONFIG.corto} a su campo.`);
  const n = [...String(p.id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  return { texto: frases.join(" "), animo: ANIMO[n % ANIMO.length] };
}

function reducirImagen(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 320, c = document.createElement("canvas"); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8));
    };
    img.onerror = rej; img.src = url;
  });
}

$("#foto-input").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";

    await S.store.set("jugadores", j.id, { ...j, foto });
    toast("Foto guardada");
  }catch(err){ toast("No se pudo usar esa imagen"); }
});

    const id = fm.dataset.id || "p" + uid();
    const { id: _, ...prev } = S.partidos.find(x => x.id === id) || {};
    const p = { ...prev, convocados,
      rival: d.rival.trim(), fecha: d.fecha, jornada: d.jornada, hora: d.hora, citacion: d.citacion,
      local: d.local === "1", equipacion: d.equipacion, pantalon: d.pantalon, medias: d.medias, campo: d.campo.trim(), direccion: d.direccion.trim(), notas: d.notas.trim(),
      gf: d.gf === "" ? "" : Math.max(0, +d.gf), gc: d.gc === "" ? "" : Math.max(0, +d.gc), goles
    };
    const suma = Object.values(goles).reduce((a, b) => a + b, 0);
    if(p.gf !== "" && suma > p.gf && !confirm(`Has apuntado ${suma} goles a jugadores pero el marcador dice ${p.gf}. ¿Guardar igualmente?`)) return;
    await S.store.set("partidos", id, p);
    abrirSheet(htmlPartido({ id, ...p }), { tipo: "partido", id, live: true });
    toast("Partido guardado");
  },
  liga: async fm => {
    const filas = [...fm.querySelectorAll("#filas .liga-row")].map(r => {
      const o = { equipo: r.querySelector('[name="equipo"]').value.trim() };
      ["pg","pe","pp","gf","gc"].forEach(k => o[k] = Math.max(0, parseInt(r.querySelector(`[name="${k}"]`).value, 10) || 0));
      return o;
    }).filter(o => o.equipo);
    await S.store.set("liga", "tabla", { filas, actualizado: Date.now() });
    cerrarSheet(); toast("Clasificación guardada");
  },
  pin: fm => {
    const j = jug(fm.dataset.id); if(!j) return;
    if(fm.pin.value.trim() !== String(pinDe(j))) return abrirPin(j, "Ese PIN no es correcto.");
    if(pinDe(j) === PIN_INICIAL) return abrirPinNuevo(j);
    S.session.me = j.id; S.session.pinOk = true; if(j.rol === "mister") S.session.admin = true; guardarSesion(); cerrarSheet(); render(); toast("¡Hola, " + j.nombre + "!");
  },
  "mis-datos": async fm => {
    const j = jug(S.session.me); if(!j) return;
    const nombre = fm.nombre.value.trim(), dorsal = fm.dorsal.value.trim();
    if(!nombre || (dorsal && !/^\d{1,2}$/.test(dorsal))){ fm.querySelector(".err").textContent = !nombre ? "Escribe tu nombre." : "El número tiene que ser de 1 o 2 cifras."; return; }
    await S.store.set("jugadores", j.id, { ...j, nombre, dorsal }); cerrarSheet(); toast("Datos guardados");
  },
  "pin-nuevo": async fm => {
    const j = jug(fm.dataset.id); if(!j) return;
    const a = fm.pin1.value.trim(), b = fm.pin2.value.trim(), nombre = fm.nombre.value.trim(), dorsal = fm.dorsal.value.trim();
    const error = !nombre ? "Escribe tu nombre." : dorsal && !/^\d{1,2}$/.test(dorsal) ? "El número tiene que ser de 1 o 2 cifras."
      : !/^\d{4}$/.test(a) ? "El PIN tienen que ser 4 cifras." : a === PIN_INICIAL ? "Elige un PIN distinto de 0000." : a !== b ? "Los dos PIN no coinciden." : "";
    if(error){ fm.querySelector(".err").textContent = error; return; }
    await S.store.set("jugadores", j.id, { ...j, nombre, dorsal, pin: a });
    S.session.me = j.id; S.session.pinOk = true; if(j.rol === "mister") S.session.admin = true; guardarSesion(); cerrarSheet(); render(); toast("¡Listo! Hola, " + nombre);
  },
  jugador: async fm => {
    const id = fm.dataset.id || "j" + uid();
    const prev = jug(id) || {};
    await S.store.set("jugadores", id, { ...prev, nombre: fm.nombre.value.trim(), dorsal: fm.dorsal.value, ...(fm.nombreLiga ? { nombreLiga: fm.nombreLiga.value.trim() } : {}) });
    cerrarSheet(); toast("Jugador guardado");
  }
};
document.addEventListener("submit", e => {
  const fm = e.target.closest("[data-form]"); if(!fm) return;
  e.preventDefault(); FORMS[fm.dataset.form]?.(fm);
});

/* ---------- Arranque ---------- */
(async function boot(){
  S.online = await initFirebase();
  if(S.session?.teamId) entrar(); else renderLogin();
})();
</script>
</body>
</html>
