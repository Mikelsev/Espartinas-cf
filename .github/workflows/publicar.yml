name: Publicar la app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:          # botón para publicarla a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    # Solo se publica lo que hay en la rama principal del repositorio
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # La misma app sirve a los dos clubes: la raíz es el Espartinas CF y /coti/ el COTI FC
      - name: Preparar la web
        run: |
          mkdir -p _site/coti
          cp -r app/. _site/
          cp app/index.html _site/coti/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
