name: Actualizar clasificación

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días a las 7:00-8:00 (hora de España)
    - cron: "0 19 * * 6,0"   # sábado y domingo por la tarde, tras los partidos
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Leer la web y guardar en Firebase
        run: node robot.mjs
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      - name: Guardar copia de lo leído
        if: always()
        run: |
          git config user.name "robot-liga"
          git config user.email "robot@users.noreply.github.com"
          git add copia || true
          git commit -m "Copia de la web $(date +%F)" || true
          git push || true
