<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Campañas</title>
<meta name="description" content="Simula cómo reacciona una población sintética a una campaña publicitaria, con grupo de control y estadística.">
<style>
:root{
  --fondo:#f5f6f8; --panel:#ffffff; --texto:#1b1f24; --suave:#5b6472; --borde:#dde1e7;
  --acento:#2a78d6; --acento2:#0a2a63; --ok:#0ca30c; --aviso:#b87900; --mal:#d03b3b;
  --var1:#2a78d6; --var2:#eb6834; --var3:#1baf7a; --control:#8a8f98;
  --pos:#2a78d6; --neg:#e34948; --neutro:#f0efec;
  --sombra:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#121314; --panel:#1a1a19; --texto:#eceef0; --suave:#a3a9b2; --borde:#33363a;
    --acento:#3987e5; --acento2:#9fc1f0; --ok:#0ca30c; --aviso:#eda100; --mal:#e66767;
    --var1:#3987e5; --var2:#d95926; --var3:#199e70; --control:#8a8f98;
    --pos:#3987e5; --neg:#e66767; --neutro:#383835; --sombra:none;
  }
}
:root[data-theme="dark"]{
  --fondo:#121314; --panel:#1a1a19; --texto:#eceef0; --suave:#a3a9b2; --borde:#33363a;
  --acento:#3987e5; --acento2:#9fc1f0; --ok:#0ca30c; --aviso:#eda100; --mal:#e66767;
  --var1:#3987e5; --var2:#d95926; --var3:#199e70; --control:#8a8f98;

}
*{box-sizing:border-box}
a{color:var(--acento)}
body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acento2);color:#fff;padding:14px 16px}
:root[data-theme="dark"] header{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{color:#0b1220}}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
.envoltorio{max-width:1100px;margin:0 auto;padding:0 16px 60px}
nav.pasos{display:flex;gap:6px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:var(--fondo);z-index:5}
nav.pasos button{flex:0 0 auto;border:1px solid var(--borde);background:var(--panel);color:var(--texto);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer}
nav.pasos button.activo{background:var(--acento);border-color:var(--acento);color:#fff}
nav.pasos button .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--fondo);color:var(--texto);font-size:12px;line-height:20px;text-align:center;margin-right:5px}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:16px;margin:12px 0;box-shadow:var(--sombra)}
.panel h2{margin:0 0 4px;font-size:18px}
.panel h3{margin:14px 0 6px;font-size:15px}
.ayuda{color:var(--suave);font-size:13px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--fondo);color:var(--texto);font:inherit}
textarea{min-height:80px;resize:vertical}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--acento);color:#fff;margin:10px 8px 0 0}
.btn.sec{background:transparent;color:var(--acento);border:1px solid var(--acento)}
.btn.peligro{background:var(--mal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--borde);border-radius:16px;padding:4px 10px;font-size:13px;background:var(--fondo);cursor:pointer;user-select:none}
.chip input{margin:0}
.aviso{border-left:4px solid var(--aviso);background:var(--fondo);padding:8px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.aviso.ok{border-color:var(--ok)}
.aviso.mal{border-color:var(--mal)}
.variante{border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin:10px 0;position:relative}
.variante .marca{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.variante .quitar{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mal);cursor:pointer;font-size:13px}
.miniatura{max-width:160px;max-height:160px;border-radius:8px;display:block;margin-top:6px;border:1px solid var(--borde)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
th{color:var(--suave);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tabla-scroll{overflow-x:auto}
.barra{height:10px;background:var(--fondo);border-radius:6px;overflow:hidden;border:1px solid var(--borde)}
.barra>div{height:100%;background:var(--acento);width:0;transition:width .3s}
.estado{font-size:13px;color:var(--suave);margin-top:6px}
.mundo{max-height:420px;overflow-y:auto;border:1px solid var(--borde);border-radius:10px;padding:6px;background:var(--fondo)}
.post{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.post .quien{font-weight:600}
.post .meta{color:var(--suave);font-size:12px}
.etq{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--borde);color:var(--suave);margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:10px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .t{font-size:12px;color:var(--suave)}
.mapa td.celda{text-align:center;font-variant-numeric:tabular-nums;border:2px solid var(--panel);border-radius:4px;cursor:default;min-width:70px}
.informe-md h1{font-size:20px}.informe-md h2{font-size:17px;margin-top:18px}.informe-md h3{font-size:15px}
.informe-md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--acento);background:var(--fondo);border-radius:4px}
.chat{border:1px solid var(--borde);border-radius:10px;padding:8px;max-height:380px;overflow-y:auto;background:var(--fondo)}
.msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.msg.yo{background:var(--acento);color:#fff;margin-left:auto}
.msg.el{background:var(--panel);border:1px solid var(--borde)}
.entrada-chat{display:flex;gap:8px;margin-top:8px}
.entrada-chat input{flex:1}
.entrada-chat .btn{margin:0}
.grafo text{font-size:11px;fill:var(--texto)}
.grafo line{stroke:var(--borde);stroke-width:1.5}
.tooltip{position:fixed;pointer-events:none;background:var(--panel);color:var(--texto);border:1px solid var(--borde);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:50;display:none;max-width:260px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--suave);margin:4px 0}
.leyenda span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.oculto{display:none!important}
footer{color:var(--suave);font-size:12px;text-align:center;padding:20px}
</style>
</head>

  { name: "entrevistar", description: "Hace una pregunta a varios agentes del mundo simulado y devuelve sus respuestas (máximo 5 agentes). Úsalo para entender el porqué.", input_schema: obj({ segmento: { type: "string" }, variante: { type: "string", description: "A, B, C o control" }, pregunta: { type: "string" }, n: { type: "integer" } }) },

function filtrarAgentes(seg, v) { return S.p.poblacion.filter(a => (!seg || a.segmento === seg) && (!v || a.grupo === v) && a.respuestas.length); }
async function ejecutarHerramienta(nombre, inp, an) {

    const res = await Promise.all(ags.map(async a => `@${a.usuario} (${a.edad}, ${a.segmento}, versión ${a.grupo}): ${await responderAgente(a, inp.pregunta, [])}`));

async function redactarInformeIA(an, alPaso) {
  const system = `Eres el redactor de informes de un simulador de campañas publicitarias (al estilo de MiroFish). Escribes en español de España, claro y para alguien que no es estadístico.
Antes de escribir, usa las herramientas: consulta las estadísticas, lee comentarios de los agentes y entrevista a algunos para entender el porqué (al menos 3 consultas, como mucho 8).
Luego escribe el informe en Markdown con estas secciones (## ): Resumen en 3 frases; Dónde funciona mejor; Por qué (con citas literales de agentes en > blockquote); Qué versión elegir; Qué cambiaría; Fiabilidad del resultado.
Reglas: no inventes cifras, usa solo las de las herramientas. Una diferencia cuyo intervalo cruza 0 o con p ajustado ≥ 0,05 NO es un resultado: dilo. Recuerda que es una simulación: sirve para comparar, no para predecir ventas, y conviene calibrarla con campañas pasadas.`;
  const messages = [{ role: "user", content: resumenParaInforme(an) + "\n\nInvestiga y redacta el informe." }];
  for (let i = 0; i < 12; i++) {
    const r = await peticion({ max_tokens: 16000, system, messages, tools: HERRAMIENTAS, output_config: { effort: "medium" } });
    messages.push({ role: "assistant", content: r.content });
    const usos = r.content.filter(b => b.type === "tool_use");
    if (r.stop_reason !== "tool_use" || !usos.length) return textoDe(r);
    const resultados = [];
    for (const u of usos) {
      alPaso && alPaso(`${u.name}: ${JSON.stringify(u.input).slice(0, 120)}`);
      let out, err = false;
      try { out = await ejecutarHerramienta(u.name, u.input || {}, an); } catch (e) { out = String(e.message || e); err = true; }
      resultados.push({ type: "tool_result", tool_use_id: u.id, content: out, ...(err ? { is_error: true } : {}) });
    }
    messages.push({ role: "user", content: resultados });
  }

}

/* ---------------- Markdown mínimo y seguro ---------------- */
function md(t) {
  const lineas = String(t || "").split("\n"); let h = "", lista = null;
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cerrar = () => { if (lista) { h += `</${lista}>`; lista = null; } };
  for (const l of lineas) {
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { cerrar(); h += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^>\s?(.*)/))) { cerrar(); h += `<blockquote>${inl(m[1])}</blockquote>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (lista !== "ul") { cerrar(); h += "<ul>"; lista = "ul"; } h += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+\.\s+(.*)/))) { if (lista !== "ol") { cerrar(); h += "<ol>"; lista = "ol"; } h += `<li>${inl(m[1])}</li>`; }
    else if (!l.trim()) cerrar();
    else { cerrar(); h += `<p>${inl(l)}</p>`; }
  }
  cerrar(); return h;
}

function grafoSVG(m) {

  const idx = n => ents.findIndex(e => e.nombre.toLowerCase() === String(n).toLowerCase());
  const rel = (m.relaciones || []).map(r => [idx(r.de), idx(r.a), r.relacion]).filter(([a, b]) => a >= 0 && b >= 0);
  const lineas = rel.length ? rel : ents.map((_, i) => [ci, i, ""]).filter(([a, b]) => a !== b);
  return `<svg class="grafo" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mapa de entidades de la campaña">
    ${lineas.map(([a, b]) => `<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"/>`).join("")}
    ${ents.map((e, i) => `<g><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="${i === ci ? 9 : 6}" fill="${col[e.tipo] || "var(--suave)"}" stroke="var(--panel)" stroke-width="2"><title>${esc(e.tipo)}: ${esc(e.nombre)}</title></circle>
      <text x="${pos[i][0]}" y="${pos[i][1] + (pos[i][1] < cy ? -12 : 20)}" text-anchor="middle">${esc(e.nombre.slice(0, 26))}</text></g>`).join("")}

}

  const tt = $("#tooltip");
  document.querySelectorAll("[data-tip]").forEach(el => {
    const mostrar = ev => { const p = ev.touches ? ev.touches[0] : ev; tt.innerHTML = el.dataset.tip.split("|").map((l, i) => i ? esc(l) : `<strong>${esc(l)}</strong>`).join("<br>"); tt.style.display = "block"; const x = Math.min(p.clientX + 12, innerWidth - tt.offsetWidth - 8); tt.style.left = x + "px"; tt.style.top = (p.clientY + 14) + "px"; };
    el.addEventListener("mousemove", mostrar); el.addEventListener("touchstart", mostrar, { passive: true });
    el.addEventListener("mouseleave", () => tt.style.display = "none");
  });
}
document.addEventListener("touchstart", e => { if (!e.target.closest("[data-tip]")) $("#tooltip").style.display = "none"; }, { passive: true });

/* paso 5: entrevistas */
let _quien = "redactor";
function vistaEntrevistas() {
  const p = S.p;
  if (!p.sim) return `<section class="panel"><h2>5 · Entrevistas</h2><p>Primero haz la simulación en el <a href="#" data-ir="2">paso 3</a>.</p></section>`;
  const ags = p.poblacion.filter(a => a.respuestas.length);
  const chat = p.chats[_quien] || [];
  const a = ags.find(x => String(x.id) === String(_quien));
  return `${bannerModo()}
  <section class="panel"><h2>5 · Conversa con el mundo simulado</h2>
    <p class="ayuda">Pregunta a cualquier persona simulada qué pensó del anuncio, o al redactor del informe por los datos.</p>
    <label for="e-quien">Con quién hablas</label>
    <select id="e-quien"><option value="redactor" ${_quien === "redactor" ? "selected" : ""}>📊 Redactor del informe</option>
      ${ags.map(x => `<option value="${x.id}" ${String(x.id) === String(_quien) ? "selected" : ""}>@${esc(x.usuario)} · ${x.edad} años · ${esc(x.segmento)} · ${x.grupo === "control" ? "control" : "versión " + x.grupo}</option>`).join("")}</select>
    ${a ? `<p class="ayuda" style="margin-top:8px">${esc(a.bio)}<br><em>${esc(a.memoria.join(" "))}</em></p>` : ""}
    <div class="chat" id="e-chat">${chat.map(m => m.role === "user" ? `<div class="msg yo">${esc(m.content)}</div>` : `<div class="msg el informe-md" style="white-space:normal">${md(m.content)}</div>`).join("") || `<p class="ayuda">Escribe una pregunta. Por ejemplo: «¿Qué te hizo pensar el anuncio?» o «¿Qué cambiarías para que te convenza?»</p>`}</div>
    <form class="entrada-chat" id="e-form"><input type="text" id="e-texto" placeholder="Escribe tu pregunta…" autocomplete="off"><button class="btn" type="submit">Enviar</button></form>
    <button class="btn sec" id="e-borrar">Borrar conversación</button>
  </section>`;
}
function enlazarEntrevistas() {
  if (!$("#e-quien")) return;
  $("#e-quien").onchange = e => { _quien = e.target.value; pintar(); };
  $("#e-borrar").onclick = () => { delete S.p.chats[_quien]; guardar(); pintar(); };
  const ch = $("#e-chat"); ch.scrollTop = ch.scrollHeight;
  $("#e-form").onsubmit = async ev => {
    ev.preventDefault(); const t = $("#e-texto").value.trim(); if (!t) return;
    const hist = S.p.chats[_quien] ||= [];
    const previo = hist.slice(-12);
    hist.push({ role: "user", content: t }); pintar();
    $("#e-chat").insertAdjacentHTML("beforeend", `<div class="msg el" id="e-pensando">…</div>`);
    try {
      const resp = _quien === "redactor" ? await responderRedactor(t, previo, _an || analizar()) : await responderAgente(S.p.poblacion.find(x => String(x.id) === String(_quien)), t, previo);
      hist.push({ role: "assistant", content: resp });
    } catch (e) { hist.push({ role: "assistant", content: "Error: " + e.message }); }
    guardar(); pintar(); $("#e-texto")?.focus();
  };
}

/* ajustes */
function vistaAjustes() {
  const a = S.ajustes;
  return `<section class="panel"><h2>⚙️ Ajustes</h2>
    <p class="ayuda">Sin clave, la app funciona en modo prueba. Con una clave de la API de Anthropic, cada persona simulada es un agente de IA (Claude).</p>
    <label for="a-clave">Clave de API de Anthropic</label>
    <input type="password" id="a-clave" value="${esc(a.clave)}" placeholder="sk-ant-..." autocomplete="off">
    <label class="chip" style="margin-top:8px;width:max-content"><input type="checkbox" id="a-recordar" ${a.recordar ? "checked" : ""}> Recordar la clave en este navegador</label>
    <div class="aviso mal">La clave se usa directamente desde tu navegador y nunca se sube al repositorio. Aun así, crea una clave solo para esto y ponle un <strong>límite de gasto</strong> en la consola de Anthropic. No la uses en ordenadores compartidos.</div>
    <div class="fila">
      <div><label for="a-modelo">Modelo</label><select id="a-modelo">${Object.entries(MODELOS).map(([k, m]) => `<option value="${k}" ${k === a.modelo ? "selected" : ""}>${m.nombre} · ${m.ent} $/${m.sal} $ por millón de tokens</option>`).join("")}</select></div>
      <div><label for="a-conc">Llamadas en paralelo</label><input type="number" id="a-conc" min="1" max="16" value="${a.concurrencia}"></div>
    </div>
    <p class="ayuda">Para poblaciones grandes, Haiku es mucho más barato. Opus da reacciones más matizadas; úsalo para validar con una muestra pequeña.</p>
    <button class="btn" id="a-guardar">Guardar</button>
    <h3>Gasto de esta sesión</h3>
    <p>${S.uso.llamadas.toLocaleString("es-ES")} llamadas · ${S.uso.entrada.toLocaleString("es-ES")} tokens de entrada · ${S.uso.salida.toLocaleString("es-ES")} de salida · ${S.uso.cacheLeida.toLocaleString("es-ES")} leídos de caché · ≈ ${fmt(costeUso(), 2)} $</p>
    <button class="btn sec" id="a-reset-uso">Poner contador a cero</button>
    <h3>Proyecto</h3>
    <button class="btn sec" id="a-importar">Abrir proyecto (JSON)</button><input type="file" id="a-fichero" accept="application/json" class="oculto">
    <button class="btn peligro" id="a-nuevo">Empezar un proyecto nuevo</button>
    ${avisoGuardado ? `<div class="aviso mal">El proyecto es demasiado grande para guardarse solo en el navegador. Descárgalo en JSON desde el informe para no perderlo.</div>` : ""}
    <h3>Cómo funciona (inspirado en MiroFish)</h3>
    <ol class="ayuda">
      <li><strong>Semilla:</strong> la campaña se convierte en un mapa de entidades (marca, oferta, tono, públicos…).</li>
      <li><strong>Entorno:</strong> población sintética por cuotas y una red social entre las personas de cada grupo.</li>
      <li><strong>Simulación:</strong> reparto aleatorio a control y versiones, exposición en el feed y rondas de conversación.</li>
      <li><strong>Informe:</strong> estadística (prueba t de Welch, intervalos de Newcombe, corrección de Holm, ponderación por peso real del segmento) y un agente redactor con herramientas.</li>
      <li><strong>Interacción:</strong> conversación con cualquier agente o con el redactor.</li>
    </ol>
    <p class="ayuda">Para que el resultado sea fiable: prueba antes 5–10 campañas pasadas cuyo resultado real conozcas y comprueba que el simulador las ordena bien. Si acierta el orden, puedes fiarte de sus comparaciones.</p>
  </section>`;
}
function enlazarAjustes() {
  $("#a-guardar").onclick = () => {
    S.ajustes.clave = $("#a-clave").value.trim(); S.ajustes.recordar = $("#a-recordar").checked;
    S.ajustes.modelo = $("#a-modelo").value; S.ajustes.concurrencia = clamp(parseInt($("#a-conc").value) || 4, 1, 16);
    guardar(); pintar();
  };
  $("#a-reset-uso").onclick = () => { S.uso = { entrada: 0, salida: 0, cacheLeida: 0, cacheEscrita: 0, llamadas: 0 }; guardar(); pintar(); };
  $("#a-nuevo").onclick = () => { if (confirm("¿Borrar el proyecto actual? Si no lo has guardado en JSON, se perderá.")) { S.p = nuevoProyecto(); S.paso = 0; guardar(); pintar(); } };
  $("#a-importar").onclick = () => $("#a-fichero").click();
  $("#a-fichero").onchange = async e => { try { const d = JSON.parse(await e.target.files[0].text()); if (!d.campana) throw new Error("No parece un proyecto"); S.p = { ...nuevoProyecto(), ...d }; S.paso = 0; guardar(); pintar(); } catch (err) { alert("No se pudo abrir: " + err.message); } };
}

pintar();
</script>
</body>
</html>
